<style>
/* ---------------------------------------------------------------- tokens -- */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07090f;--bg2:#0b0f19;--surface:#0f1421;--surface2:#151b2c;--surface3:#1b2235;
  --ink:#eef1f8;--mute:#8b95ad;--faint:#6b7590;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
  --acc:#c8f542;--accink:#0a0d14;--accsoft:rgba(200,245,66,.12);
  --ok:#4cd9a0;--no:#ff6b6b;--wait:#f0b84d;--info:#7aa2ff;--discord:#5865f2;
  --org:#c8f542;
  --r:14px;--r-sm:9px;--shadow:0 24px 60px rgba(0,0,0,.5);
  color-scheme:dark;
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.6;min-height:100vh;
  display:flex;flex-direction:column;overflow-x:hidden
}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:radial-gradient(900px 520px at 85% -10%,rgba(200,245,66,.10),transparent 60%),
             radial-gradient(760px 460px at -10% 8%,rgba(88,101,242,.13),transparent 60%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 0,#000 0,transparent 66%);
  mask-image:radial-gradient(ellipse at 50% 0,#000 0,transparent 66%)}
h1,h2,h3,h4,.brand,.big,.stat b,.mock-title{font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.1;letter-spacing:-.015em}
h1{font-size:clamp(2.2rem,5vw,3.7rem);font-weight:800;letter-spacing:-.03em}
h2{font-size:clamp(1.5rem,3vw,2.1rem);font-weight:800}
h3{font-size:1.08rem;font-weight:700}
h4{font-size:.98rem;font-weight:700}
p{color:var(--mute)}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
strong{color:var(--ink)}
small{font-size:.86rem}
hr{border:0;border-top:1px solid var(--line);margin:1.4rem 0}
::selection{background:var(--acc);color:var(--accink)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:4px}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:-9999px;top:0;z-index:200;background:var(--acc);color:var(--accink);padding:.7rem 1.1rem;border-radius:0 0 10px 0;font-weight:700}
.skip:focus{left:0}

/* ---------------------------------------------------------------- header -- */
.top{position:sticky;top:0;z-index:60;background:rgba(7,9,15,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;padding:.8rem 1.25rem;display:flex;align-items:center;gap:.9rem;flex-wrap:wrap}
.brand{font-size:1.16rem;font-weight:800;color:var(--ink);text-decoration:none;margin-right:auto;display:flex;align-items:center;gap:.6rem;letter-spacing:-.02em}
.brand:hover{text-decoration:none}
.mk{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--acc);color:var(--accink);font-size:1.02rem;font-weight:800;font-family:'Bricolage Grotesque',sans-serif;flex:none}
.nav{display:flex;align-items:center;gap:.15rem;flex-wrap:wrap}
.nav a{color:var(--mute);padding:.4rem .68rem;border-radius:8px;font-size:.95rem;font-weight:500;text-decoration:none}
.nav a:hover{color:var(--ink);background:var(--surface2);text-decoration:none}
.nav a.on{color:var(--ink);background:var(--surface2)}
.acct{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap}
.burger{display:none;background:transparent;border:1px solid var(--line);border-radius:8px;padding:.4rem .7rem;cursor:pointer;font-size:.92rem}
.bell{position:relative;display:inline-flex;align-items:center;gap:.4rem}
.bell .dot{background:var(--acc);color:var(--accink);border-radius:20px;font-size:.72rem;font-weight:700;padding:.05rem .42rem;line-height:1.5}
.avatar{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;background:var(--surface3);border:1px solid var(--line2);font-size:.78rem;font-weight:700;color:var(--ink)}

/* --------------------------------------------------------------- buttons -- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;background:var(--acc);color:var(--accink);border:1px solid var(--acc);padding:.6rem 1.1rem;border-radius:10px;font-weight:600;font-size:.95rem;cursor:pointer;text-decoration:none;transition:filter .15s,transform .1s,border-color .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.07);text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn[disabled],.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--mute);filter:none;background:rgba(255,255,255,.03)}
.btn.danger{background:transparent;color:var(--no);border-color:rgba(255,107,107,.4)}
.btn.danger:hover{background:rgba(255,107,107,.08);filter:none}
.btn.soft{background:var(--surface2);border-color:var(--line);color:var(--ink)}
.btn.soft:hover{background:var(--surface3);filter:none}
.btn.sm{padding:.32rem .7rem;font-size:.86rem;border-radius:8px}
.btn.lg{padding:.8rem 1.5rem;font-size:1.02rem}
.btn.block{width:100%}
.btn.link{background:none;border:none;color:var(--acc);padding:0;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.btn-row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}

/* ---------------------------------------------------------------- layout -- */
.main{max-width:1180px;width:100%;margin:0 auto;padding:2rem 1.25rem 3rem;flex:1}
.main.wide{max-width:1320px}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1rem;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.stack{display:grid;gap:.7rem}
.mt{margin-top:1rem}.mt2{margin-top:2rem}.mb{margin-bottom:1rem}.mb2{margin-bottom:2rem}
.sub{color:var(--mute)}.faint{color:var(--faint)}.ok{color:var(--ok)}.no{color:var(--no)}.warn{color:var(--wait)}
.center{text-align:center}
.nowrap{white-space:nowrap}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em}
.lead{font-size:1.12rem;color:var(--mute);max-width:44rem}
.page-head{padding:.5rem 0 1.5rem}
.page-head h1{font-size:clamp(1.9rem,4vw,2.8rem)}
.page-head .lead{margin-top:.5rem}
.crumb{color:var(--faint);font-size:.88rem;margin-bottom:.5rem;display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.crumb a{color:var(--mute)}
.sec{padding:2.8rem 0 0}
.sec>h2{margin-bottom:.5rem}
.sec>.lead{margin-bottom:1.6rem}

/* ----------------------------------------------------------------- cards -- */
.card{background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,0) 60%),var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.25rem}
.card.tight{padding:1rem}
.card.flush{padding:0;overflow:hidden}
.card h3+p,.card h2+p{margin-top:.4rem}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:1rem}
.notice{background:rgba(122,162,255,.07);border:1px solid rgba(122,162,255,.25);border-radius:var(--r);padding:.9rem 1rem;color:var(--mute);font-size:.93rem}
.notice.warn{background:rgba(240,184,77,.07);border-color:rgba(240,184,77,.28)}
.notice.good{background:rgba(76,217,160,.07);border-color:rgba(76,217,160,.28)}
.notice.bad{background:rgba(255,107,107,.07);border-color:rgba(255,107,107,.3)}
.notice strong{color:var(--ink)}
.divider{height:1px;background:var(--line);margin:1rem 0}

/* ----------------------------------------------------------------- stats -- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.8rem;margin-bottom:1.2rem}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem}
.stat b{display:block;font-size:2rem;font-weight:800;line-height:1.15}
.stat span{color:var(--mute);font-size:.86rem}
.stat small{display:block;color:var(--faint);font-size:.78rem;margin-top:.2rem}
.meter{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:.6rem}
.meter i{display:block;height:100%;background:var(--acc);border-radius:4px}

/* --------------------------------------------------------------- badges -- */
.status{display:inline-flex;align-items:center;gap:.4rem;font-size:.8rem;font-weight:600;padding:.16rem .6rem;border-radius:20px;border:1px solid var(--line2);background:var(--surface2);color:var(--mute);white-space:nowrap}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.s-draft{color:#a9b2c7}.s-wait{color:var(--wait);border-color:rgba(240,184,77,.35);background:rgba(240,184,77,.09)}
.s-info{color:var(--info);border-color:rgba(122,162,255,.35);background:rgba(122,162,255,.09)}
.s-warn{color:var(--wait);border-color:rgba(240,184,77,.45);background:rgba(240,184,77,.14)}
.s-ok{color:var(--ok);border-color:rgba(76,217,160,.35);background:rgba(76,217,160,.09)}
.s-no{color:var(--no);border-color:rgba(255,107,107,.35);background:rgba(255,107,107,.09)}
.s-mute{color:var(--faint)}
.tag{display:inline-block;font-size:.78rem;border:1px solid var(--line);border-radius:20px;padding:.05rem .6rem;color:var(--mute);background:var(--bg2)}
.tag.acc{color:var(--acc);border-color:rgba(200,245,66,.35);background:var(--accsoft)}
.tag.demo{color:var(--wait);border-color:rgba(240,184,77,.35)}
.chip{display:inline-block;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:.1rem .5rem;font-size:.8rem;color:var(--mute)}
.pill{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:30px;padding:.25rem .85rem;color:var(--mute);font-size:.86rem;margin-bottom:1rem}
.pill b{color:var(--acc);font-weight:600}

/* --------------------------------------------------------------- tables -- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;min-width:640px;font-size:.93rem}
.tbl th{text-align:left;font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600;padding:.7rem .9rem;border-bottom:1px solid var(--line);background:var(--bg2);white-space:nowrap}
.tbl td{padding:.75rem .9rem;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:rgba(255,255,255,.02)}
.tbl .name{font-weight:600;color:var(--ink)}
.tbl .sub{font-size:.82rem}
.tbl a{color:var(--ink)}
.tbl a:hover{color:var(--acc)}
.tbl .actions{display:flex;gap:.35rem;flex-wrap:wrap}

/* ---------------------------------------------------------------- forms -- */
.field{display:flex;flex-direction:column;gap:.3rem;margin-bottom:1rem}
.field>label,.lbl{font-weight:500;font-size:.93rem;color:var(--ink)}
.field .help{color:var(--faint);font-size:.82rem}
.field .err{color:var(--no);font-size:.82rem}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:rgba(255,107,107,.6)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=url],input[type=date],input[type=datetime-local],select,textarea{
  background:var(--bg2);border:1px solid var(--line2);border-radius:9px;padding:.62rem .75rem;width:100%;color:var(--ink);transition:border-color .15s,background .15s
}
input::placeholder,textarea::placeholder{color:#5b6480}
input:hover,select:hover,textarea:hover{border-color:rgba(255,255,255,.24)}
input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:none;background:var(--bg)}
textarea{min-height:110px;resize:vertical;line-height:1.55}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:2rem}
select option{background:var(--surface)}
.chk{display:flex;gap:.55rem;align-items:flex-start;margin:.3rem 0;font-size:.94rem}
.chk input{width:auto;margin-top:.28rem;accent-color:var(--acc);flex:none}
.inline-fields{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.form-actions{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:1.2rem}
.error-box{background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.35);color:#ffc9c9;padding:.75rem .9rem;border-radius:10px;font-size:.9rem;margin-bottom:1rem}

/* ----------------------------------------------------------------- hero -- */
.hero{display:grid;grid-template-columns:1.06fr .94fr;gap:3rem;align-items:center;padding:2.5rem 0 3rem}
.hero .lead{margin:1.1rem 0 1.7rem;font-size:1.16rem}
.hero h1 .hl{color:var(--acc)}
.mock{background:var(--surface);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.mock-top{display:flex;align-items:center;gap:.4rem;padding:.7rem .9rem;border-bottom:1px solid var(--line);background:var(--surface2)}
.mock-dot{width:9px;height:9px;border-radius:50%;background:var(--line2)}
.mock-title{margin-left:.5rem;font-size:.88rem;color:var(--mute);font-weight:600}
.mock-body{padding:1.1rem}
.mock-row{display:flex;justify-content:space-between;gap:1rem;align-items:center;padding:.6rem 0;border-bottom:1px solid var(--line);font-size:.9rem}
.mock-row:last-child{border-bottom:none}
.mock-name{font-weight:600;color:var(--ink)}
.mock-ans{color:var(--mute);font-size:.84rem;margin-top:.15rem}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:1.3rem 0;margin-top:.5rem}
.strip b{display:block;color:var(--ink);font-family:'Bricolage Grotesque',sans-serif;font-size:1.15rem}
.strip span{color:var(--mute);font-size:.9rem}

/* -------------------------------------------------------------- features -- */
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
.feat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.35rem;transition:border-color .2s,transform .2s}
.feat:hover{border-color:rgba(200,245,66,.35);transform:translateY(-2px)}
.feat .n{color:var(--acc);font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:.82rem;letter-spacing:.08em;margin-bottom:.55rem}
.feat h3{margin-bottom:.35rem}
.feat p{font-size:.93rem}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.35rem;counter-increment:s}
.step::before{content:counter(s);display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--acc);color:var(--accink);font-weight:800;margin-bottom:.7rem}
.band{background:linear-gradient(135deg,rgba(200,245,66,.13),rgba(88,101,242,.12));border:1px solid var(--line);border-radius:18px;padding:2.2rem;display:flex;justify-content:space-between;align-items:center;gap:1.5rem;flex-wrap:wrap;margin-top:2.5rem}
.band h2{margin-bottom:.3rem}
.band p{max-width:36rem}

/* ------------------------------------------------------------- templates -- */
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1rem}
.tpl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.2rem;display:flex;flex-direction:column;gap:.55rem}
.tpl h3{font-size:1rem}
.tpl p{font-size:.88rem;flex:1}
.tpl .meta{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}

/* ---------------------------------------------------------------- tiers -- */
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
.tier{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.5rem;display:flex;flex-direction:column;gap:.7rem}
.tier.cur{border-color:rgba(200,245,66,.5);box-shadow:0 0 0 1px rgba(200,245,66,.15) inset}
.big{font-size:2.2rem;font-weight:800}
.big small{font-size:.9rem;color:var(--mute);font-weight:500}
.perks{list-style:none;color:var(--mute);font-size:.91rem;display:grid;gap:.3rem}
.perks li::before{content:"✓ ";color:var(--acc);font-weight:700}

/* ------------------------------------------------------------- app shell -- */
.adm{display:grid;grid-template-columns:220px minmax(0,1fr);gap:1.4rem;align-items:start}
.side{position:sticky;top:78px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.6rem;display:grid;gap:.15rem}
.side a{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.48rem .7rem;border-radius:8px;color:var(--mute);font-size:.92rem;text-decoration:none;font-weight:500}
.side a:hover{background:var(--surface2);color:var(--ink);text-decoration:none}
.side a.on{background:var(--surface2);color:var(--ink)}
.side .side-head{padding:.5rem .7rem .6rem;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:600}
.side .count{background:var(--surface3);border-radius:20px;padding:0 .45rem;font-size:.75rem;color:var(--mute)}
.org-head{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;margin-bottom:1.2rem;padding-bottom:1rem;border-bottom:1px solid var(--line)}
.org-mark{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-family:'Bricolage Grotesque',sans-serif;color:#07090f;flex:none}
.org-head h1{font-size:1.5rem}
.org-head p{font-size:.88rem}

/* --------------------------------------------------------------- builder -- */
.qcard{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:1rem;margin-bottom:.8rem}
.qcard-head{display:flex;justify-content:space-between;align-items:center;gap:.6rem;margin-bottom:.7rem;flex-wrap:wrap}
.qnum{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--surface3);color:var(--mute);font-size:.78rem;font-weight:700;flex:none}
.qcard .field{margin-bottom:.7rem}
.qcard .field:last-child{margin-bottom:0}
.qcard-actions{display:flex;gap:.35rem;flex-wrap:wrap}
.qgrid{display:grid;grid-template-columns:minmax(0,1fr) 170px 120px;gap:.7rem;align-items:start}
.qopts{grid-column:1/-1}

/* ------------------------------------------------------------- timeline -- */
.timeline{display:grid;gap:0;margin-top:.5rem}
.tl{display:grid;grid-template-columns:26px 1fr;gap:.7rem;position:relative;padding-bottom:1rem}
.tl:last-child{padding-bottom:0}
.tl .dot{width:26px;height:26px;border-radius:50%;background:var(--surface2);border:1px solid var(--line2);display:grid;place-items:center;font-size:.72rem;color:var(--mute);z-index:1}
.tl:not(:last-child)::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:1px;background:var(--line)}
.tl .body{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:.65rem .8rem;font-size:.9rem}
.tl .body .who{font-weight:600;color:var(--ink)}
.tl .body .when{color:var(--faint);font-size:.78rem;margin-left:.4rem}
.tl .body p{margin-top:.2rem;color:var(--mute);white-space:pre-wrap;word-break:break-word}
.tl.internal .body{border-style:dashed;background:rgba(240,184,77,.05);border-color:rgba(240,184,77,.25)}
.tl.internal .body::after{content:"Internal only";display:inline-block;margin-top:.4rem;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--wait)}
.tl.applicant .body{background:rgba(200,245,66,.05);border-color:rgba(200,245,66,.22)}

/* ----------------------------------------------------------------- chat -- */
.msgs{display:flex;flex-direction:column;gap:.5rem;max-height:420px;overflow:auto;padding:.2rem}
.msg{max-width:85%;padding:.55rem .8rem;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:.9rem;white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-end;background:rgba(200,245,66,.12);border-color:rgba(200,245,66,.3)}
.msg small{display:block;color:var(--faint);font-size:.72rem;margin-top:.2rem}

/* ----------------------------------------------------------------- misc -- */
.empty{text-align:center;padding:2.4rem 1rem;border:1px dashed var(--line2);border-radius:var(--r);background:rgba(255,255,255,.01)}
.empty h3{margin-bottom:.35rem}
.empty p{max-width:34rem;margin:0 auto .9rem;font-size:.92rem}
.flashes{display:grid;gap:.5rem;margin-bottom:1rem}
.flash{padding:.7rem 1rem;border-radius:10px;font-size:.92rem;border:1px solid var(--line2);background:var(--surface)}
.flash.good{border-color:rgba(76,217,160,.4);background:rgba(76,217,160,.08);color:#c9f7e6}
.flash.bad{border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.08);color:#ffd0d0}
.flash.info{border-color:rgba(122,162,255,.4);background:rgba(122,162,255,.08);color:#d6e2ff}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:.7rem 1.1rem;border-radius:10px;font-weight:600;font-size:.92rem;z-index:150;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:min(92vw,520px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bad{background:var(--no);color:#1a0505}
.pager{display:flex;gap:.4rem;align-items:center;justify-content:center;margin-top:1rem;flex-wrap:wrap}
.pager a,.pager span{padding:.35rem .7rem;border-radius:8px;border:1px solid var(--line);color:var(--mute);font-size:.88rem}
.pager .cur{background:var(--surface2);color:var(--ink);border-color:var(--line2)}
.filters{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:.6rem;align-items:end;margin-bottom:1rem}
.filters .field{margin-bottom:0}
.kv{display:grid;grid-template-columns:160px 1fr;gap:.5rem 1rem;font-size:.92rem}
.kv dt{color:var(--faint)}
.kv dd{color:var(--ink);word-break:break-word}
.answer{border-bottom:1px solid var(--line);padding:.8rem 0}
.answer:last-child{border-bottom:none}
.answer .q{font-weight:600;color:var(--ink);font-size:.92rem;margin-bottom:.25rem}
.answer .a{color:var(--mute);white-space:pre-wrap;word-break:break-word;font-size:.94rem}
.answer .a.empty-answer{color:var(--faint);font-style:italic}
.tabs{display:flex;gap:.2rem;border-bottom:1px solid var(--line);margin-bottom:1.2rem;overflow-x:auto}
.tabs a{padding:.55rem .8rem;color:var(--mute);font-size:.92rem;border-bottom:2px solid transparent;white-space:nowrap;text-decoration:none;font-weight:500}
.tabs a:hover{color:var(--ink);text-decoration:none}
.tabs a.on{color:var(--ink);border-bottom-color:var(--acc)}
.code{display:flex;gap:.5rem;align-items:center;background:var(--bg2);border:1px solid var(--line2);border-radius:9px;padding:.55rem .7rem;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;overflow-wrap:anywhere}
.code span{flex:1;min-width:0}
.copy{background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:.25rem .55rem;font-size:.78rem;cursor:pointer;color:var(--mute);flex:none}
.copy:hover{color:var(--ink);border-color:var(--mute)}
.brandbar{height:4px;background:var(--org);border-radius:4px;margin-bottom:1rem}
.brand-preview{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.brand-preview .bp-top{background:var(--org);height:6px}
.brand-preview .bp-body{padding:1.2rem;background:var(--surface)}
.bp-mark{width:38px;height:38px;border-radius:10px;background:var(--org);display:grid;place-items:center;color:#07090f;font-weight:800;font-family:'Bricolage Grotesque',sans-serif;margin-bottom:.6rem}
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.9rem 1.1rem;margin-bottom:.6rem}

/* ------------------------------------------------------------------ store -- */

function blankData() {
  return {
    version: VERSION,
    demo: false,
    users: [], orgs: [], members: [], forms: [], questions: [], submissions: [],
    events: [], notifications: [], templates: [], automations: [], automationRuns: [],
    audit: [], invites: [], guilds: [], support: [], sessions: {},
    settings: {
      siteName: 'KS Applications',
      supportEmail: '',
      banner: '',
      registrationOpen: true
    }
  };
}

const DB = {
  data: blankData(),
  memoryOnly: false,
  load() {
    const raw = storage.getItem(STORE_KEY);
    if (raw) {
      try {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.version === VERSION) this.data = Object.assign(blankData(), parsed);
      } catch (error) {
        console.warn('Stored data could not be read, starting fresh.', error);
      }
    }
    try { this.memoryOnly = storage !== window.localStorage; } catch { this.memoryOnly = true; }
  },
  save() {
    try {
      storage.setItem(STORE_KEY, JSON.stringify(this.data));
    } catch (error) {
      toast('This browser is out of local storage space. Remove some demo data or attachments.', 'bad');
      console.warn('Save failed', error);
    }
  },
  reset({ demo = false } = {}) {
    const settings = this.data.settings || blankData().settings;
    this.data = blankData();
    this.data.settings = settings;
    this.data.demo = demo;
    ensureTemplates();
    storage.removeItem(SESSION_KEY);
    this.save();
  }
};

function ensureTemplates() {
  const existing = new Set(DB.data.templates.map((t) => t.id));
  for (const tpl of BUILTIN_TEMPLATES) {
    if (existing.has(tpl.id)) continue;
    DB.data.templates.push({
      id: tpl.id, orgId: null, ownerId: null, name: tpl.name, kind: tpl.kind,
      description: tpl.description, questions: JSON.parse(JSON.stringify(tpl.questions)),
      builtin: true, createdAt: now()
    });
  }
}

/* ------------------------------------------------------------------ utils -- */

let idSeq = 0;
function id(prefix) {
  idSeq += 1;
  return `${prefix}_${Date.now().toString(36)}${idSeq.toString(36)}${Math.random().toString(36).slice(2, 6)}`;
}

function now() { return new Date().toISOString(); }
function nowMs() { return Date.now(); }
function daysAgo(n) { return new Date(Date.now() - n * 86400000).toISOString(); }
function hoursAgo(n) { return new Date(Date.now() - n * 3600000).toISOString(); }

function byId(list, value) { return list.find((item) => item.id === value) || null; }
function userById(value) { return byId(DB.data.users, value); }
function orgById(value) { return byId(DB.data.orgs, value); }
function orgBySlug(value) { return DB.data.orgs.find((o) => o.slug === value && !o.deletedAt) || null; }
function formById(value) { return byId(DB.data.forms, value); }
function submissionById(value) { return byId(DB.data.submissions, value); }
function memberById(value) { return byId(DB.data.members, value); }

function questionsFor(formId) {
  return DB.data.questions.filter((q) => q.formId === formId).sort((a, b) => a.position - b.position);
}

function membersFor(orgId) {
  return DB.data.members.filter((m) => m.orgId === orgId && m.status !== 'removed');
}

function membershipFor(orgId, userId = (currentUser() || {}).id) {
  if (!userId) return null;
  return DB.data.members.find((m) => m.orgId === orgId && m.userId === userId && m.status === 'active') || null;
}

function myRole(orgId) {
  const member = membershipFor(orgId);
  return member ? member.role : null;
}

function myOrgs() {
  const user = currentUser();
  if (!user) return [];
  return DB.data.orgs.filter((org) => !org.deletedAt && membershipFor(org.id, user.id));
}

function can(role, capability) {
  const allowed = CAPS[capability];
  return Array.isArray(allowed) && allowed.includes(role);
}

function canOrg(orgId, capability) {
  return can(myRole(orgId), capability);
}

function requireCan(orgId, capability) {
  if (!canOrg(orgId, capability)) throw new Error('You do not have permission to do that.');
}

function esc(value) {
  return String(value === undefined || value === null ? '' : value).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function attr(value) { return esc(value); }

function slugify(value) {
  return String(value || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
}

function fmtDate(value) {
  if (!value) return '—';
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

function fmtDateTime(value) {
  if (!value) return '—';
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return '—';
  return d.toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function timeAgo(value) {
  if (!value) return '';
  const diff = Date.now() - new Date(value).getTime();
  if (Number.isNaN(diff)) return '';
  const mins = Math.round(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hours = Math.round(mins / 60);
  if (hours < 24) return `${hours}h ago`;
  const days = Math.round(hours / 24);
  if (days < 30) return `${days}d ago`;
  return fmtDate(value);
}

function toLocalInput(value) {
  if (!value) return '';
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return '';
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function initials(name) {
  return String(name || '?').trim().split(/\s+/).slice(0, 2).map((p) => p.charAt(0).toUpperCase()).join('') || '?';
}

function bytes(size) {
  const n = Number(size || 0);
  if (n < 1024) return `${n} B`;
  if (n < 1048576) return `${Math.round(n / 1024)} KB`;
  return `${(n / 1048576).toFixed(1)} MB`;
}

function plural(n, one, many = `${one}s`) { return `${n} ${n === 1 ? one : many}`; }

function statusPill(status) {
  const meta = STATUS[status] || { label: status || 'Unknown', cls: 's-mute' };
  return `<span class="status ${meta.cls}">${esc(meta.label)}</span>`;
}

function formPill(status) {
  const meta = FORM_STATUS[status] || { label: status, cls: 's-mute' };
  return `<span class="status ${meta.cls}">${esc(meta.label)}</span>`;
}

function kindTag(kind) { return `<span class="tag">${esc(KIND_LABELS[kind] || kind)}</span>`; }

function flash(type, message) {
  FLASH.push({ type, message });
}

function flashHtml() {
  if (!FLASH.length) return '';
  const html = FLASH.map((f) => `<div class="flash ${f.type === 'error' ? 'bad' : f.type === 'info' ? 'info' : 'good'}">${esc(f.message)}</div>`).join('');
  FLASH = [];
  return `<div class="flashes" role="status" aria-live="polite">${html}</div>`;
}

let FLASH = [];
let toastTimer = null;
function toast(message, type = 'good') {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = message;
  el.className = `toast show${type === 'bad' ? ' bad' : ''}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 4200);
}

function copyText(text) {
  const value = String(text);
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(value).then(() => toast('Copied to clipboard')).catch(() => fallbackCopy(value));
  } else {
    fallbackCopy(value);
  }
}

function fallbackCopy(value) {
  const area = document.createElement('textarea');
  area.value = value;
  area.setAttribute('readonly', '');
  area.style.position = 'fixed';
  area.style.opacity = '0';
  document.body.appendChild(area);
  area.select();
  try { document.execCommand('copy'); toast('Copied to clipboard'); }
  catch { toast('Could not copy. Select the text and copy it manually.', 'bad'); }
  area.remove();
}

function download(filename, content, mime = 'text/plain') {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function csvCell(value) {
  const s = String(value === undefined || value === null ? '' : value);
  return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

function toCsv(rows) {
  return rows.map((row) => row.map(csvCell).join(',')).join('\r\n');
}

function linkTo(path) { return `${location.href.split('#')[0]}#${path}`; }

/* ------------------------------------------------------------------- auth -- */

async function derivePassword(password, salt) {
  if (window.crypto && window.crypto.subtle) {
    try {
      const enc = new TextEncoder();
      const key = await crypto.subtle.importKey('raw', enc.encode(String(password)), 'PBKDF2', false, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits(
        { name: 'PBKDF2', salt: enc.encode(salt), iterations: 120000, hash: 'SHA-256' },
        key, 256
      );
      return Array.from(new Uint8Array(bits)).map((b) => b.toString(16).padStart(2, '0')).join('');
    } catch { /* fall through to the local fallback */ }
  }
  let h = 2166136261;
  const source = `${salt}|${password}`;
  for (let round = 0; round < 3000; round += 1) {
    for (let i = 0; i < source.length; i += 1) {
      h ^= source.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
  }
  return `fb${(h >>> 0).toString(16)}`;
}

function randomToken() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return `t${Date.now().toString(36)}${Math.random().toString(36).slice(2)}${Math.random().toString(36).slice(2)}`;
}

function findUserByEmail(email) {
  const value = String(email || '').trim().toLowerCase();
  return DB.data.users.find((u) => u.email.toLowerCase() === value && !u.deletedAt) || null;
}

function currentUser() {
  const token = storage.getItem(SESSION_KEY);
  if (!token) return null;
  const session = DB.data.sessions[token];
  if (!session) return null;
  if (new Date(session.expiresAt).getTime() < Date.now()) {
    delete DB.data.sessions[token];
    storage.removeItem(SESSION_KEY);
    DB.save();
    return null;
  }
  const user = userById(session.userId);
  if (!user || user.deletedAt || user.status === 'suspended') return null;
  return user;
}

function startSession(user) {
  const token = randomToken();
  DB.data.sessions[token] = {
    userId: user.id,
    createdAt: now(),
    expiresAt: new Date(Date.now() + 30 * 86400000).toISOString()
  };
  storage.setItem(SESSION_KEY, token);
  user.lastLoginAt = now();
  DB.save();
  return token;
}

function logout() {
  const token = storage.getItem(SESSION_KEY);
  if (token) delete DB.data.sessions[token];
  storage.removeItem(SESSION_KEY);
  DB.save();
  go('/');
  toast('Signed out');
}

async function registerUser({ name, email, password, password2 }) {
  const cleanName = String(name || '').trim();
  const cleanEmail = String(email || '').trim().toLowerCase();
  if (cleanName.length < 2) throw new Error('Enter your name.');
  if (cleanName.length > 80) throw new Error('That name is too long.');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(cleanEmail)) throw new Error('Enter a valid email address.');
  if (findUserByEmail(cleanEmail)) throw new Error('An account with that email already exists. Log in instead.');
  if (String(password || '').length < 10) throw new Error('Use at least 10 characters for your password.');
  if (password !== password2) throw new Error('The two passwords do not match.');
  if (!DB.data.settings.registrationOpen) throw new Error('Registration is currently closed.');

  const salt = randomToken().slice(0, 16);
  const passwordHash = await derivePassword(password, salt);
  const user = {
    id: id('usr'), name: cleanName, email: cleanEmail, salt, passwordHash,
    platformRole: 'user', status: 'active', discordId: '', prefs: { notifyApplicationUpdates: true },
    createdAt: now(), lastLoginAt: now()
  };
  DB.data.users.push(user);

  // Any pending invitations addressed to this email become active memberships.
  for (const invite of DB.data.invites) {
    if (invite.status !== 'pending' || invite.email !== cleanEmail) continue;
    invite.status = 'accepted';
    const member = DB.data.members.find((m) => m.orgId === invite.orgId && m.email === cleanEmail);
    if (member) {
      member.userId = user.id;
      member.name = user.name;
      member.status = 'active';
      member.acceptedAt = now();
    }
    notify(user.id, {
      kind: 'org.invite',
      title: `You joined ${(orgById(invite.orgId) || {}).name || 'an organization'}`,
      body: `Your invitation was accepted automatically. Role: ${ROLE_LABELS[invite.role]}.`,
      link: `/org/${(orgById(invite.orgId) || {}).slug || ''}`
    });
  }

  startSession(user);
  auditLog(null, 'user.registered', { email: cleanEmail }, user.id);
  notify(user.id, {
    kind: 'welcome',
    title: 'Welcome to KS Applications',
    body: 'Create an application, share its link, and review submissions in one inbox.',
    link: '/dashboard'
  });
  DB.save();
  return user;
}

async function loginUser(email, password) {
  const user = findUserByEmail(email);
  if (!user) throw new Error('Email or password is incorrect.');
  if (user.status === 'suspended') throw new Error('This account is suspended. Contact support.');
  const attempt = await derivePassword(password, user.salt);
  if (attempt !== user.passwordHash) throw new Error('Email or password is incorrect.');
  startSession(user);
  auditLog(null, 'user.login', { email: user.email }, user.id);
  return user;
}

async function changePassword(user, current, next, confirm) {
  const attempt = await derivePassword(current, user.salt);
  if (attempt !== user.passwordHash) throw new Error('Your current password is incorrect.');
  if (String(next || '').length < 10) throw new Error('Use at least 10 characters for the new password.');
  if (next !== confirm) throw new Error('The two new passwords do not match.');
  user.salt = randomToken().slice(0, 16);
  user.passwordHash = await derivePassword(next, user.salt);
  // Invalidate every other session.
  const active = storage.getItem(SESSION_KEY);
  for (const [token, session] of Object.entries(DB.data.sessions)) {
    if (session.userId === user.id && token !== active) delete DB.data.sessions[token];
  }
  DB.save();
  auditLog(null, 'user.password_changed', {}, user.id);
}

/* ------------------------------------------------------- orgs & membership -- */

function orgUsage(orgId) {
  const forms = DB.data.forms.filter((f) => f.orgId === orgId && !f.deletedAt);
  const formIds = new Set(forms.map((f) => f.id));
  const subs = DB.data.submissions.filter((s) => formIds.has(s.formId));
  const monthStart = new Date();
  monthStart.setDate(1); monthStart.setHours(0, 0, 0, 0);
  return {
    forms: forms.length,
    seats: membersFor(orgId).filter((m) => m.status !== 'removed').length,
    total: subs.filter((s) => s.status !== 'draft').length,
    pending: subs.filter((s) => s.status === 'submitted').length,
    reviewing: subs.filter((s) => s.status === 'under_review').length,
    info: subs.filter((s) => s.status === 'info_required').length,
    approved: subs.filter((s) => s.status === 'approved').length,
    rejected: subs.filter((s) => s.status === 'rejected').length,
    closed: subs.filter((s) => s.status === 'closed').length,
    thisMonth: subs.filter((s) => s.submittedAt && new Date(s.submittedAt) >= monthStart).length
  };
}

function createOrg({ name, slug, description, brandColor, owner }) {
  const cleanName = String(name || '').trim();
  if (cleanName.length < 2) throw new Error('Enter an organization name.');
  if (cleanName.length > 90) throw new Error('That organization name is too long.');
  const cleanSlug = slugify(slug || cleanName);
  if (cleanSlug.length < 2) throw new Error('The workspace address needs at least two characters.');
  if (DB.data.orgs.some((o) => o.slug === cleanSlug && !o.deletedAt)) throw new Error('That workspace address is already taken.');

  const org = {
    id: id('org'), name: cleanName, slug: cleanSlug, ownerId: owner.id,
    description: String(description || '').trim().slice(0, 400),
    brandColor: /^#[0-9a-f]{6}$/i.test(brandColor || '') ? brandColor : '#c8f542',
    logoUrl: '', website: '', supportEmail: owner.email,
    confirmationMessage: 'Thanks — your application has been received. We will be in touch.',
    plan: 'business', planStatus: 'active', seatLimit: 10, formLimit: 25,
    discordWebhookUrl: '', customDomain: '', demo: false,
    createdAt: now(), updatedAt: now()
  };
  DB.data.orgs.push(org);
  DB.data.members.push({
    id: id('mem'), orgId: org.id, userId: owner.id, email: owner.email, name: owner.name,
    role: 'owner', status: 'active', invitedBy: owner.id, createdAt: now(), acceptedAt: now()
  });
  auditLog(org.id, 'org.created', { name: org.name }, owner.id);
  DB.save();
  return org;
}

function updateOrg(org, patch) {
  Object.assign(org, patch, { updatedAt: now() });
  DB.save();
}

function inviteMember(org, { email, role, actor }) {
  const cleanEmail = String(email || '').trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(cleanEmail)) throw new Error('Enter a valid email address.');
  if (!['admin', 'manager', 'reviewer', 'staff', 'viewer'].includes(role)) throw new Error('Choose a valid role.');
  if (membersFor(org.id).some((m) => m.email === cleanEmail && m.status !== 'removed')) {
    throw new Error('That person is already on the team.');
  }
  const usage = orgUsage(org.id);
  if (usage.seats >= org.seatLimit) throw new Error(`This plan allows ${org.seatLimit} seats. Remove someone or upgrade the plan.`);
  const existing = findUserByEmail(cleanEmail);
  const token = randomToken();
  DB.data.invites.push({
    id: id('inv'), orgId: org.id, email: cleanEmail, role, token,
    invitedBy: actor.id, createdAt: now(), status: 'pending'
  });
  const member = {
    id: id('mem'), orgId: org.id, userId: existing ? existing.id : null, email: cleanEmail,
    name: existing ? existing.name : '', role, status: existing ? 'active' : 'invited',
    invitedBy: actor.id, createdAt: now(), acceptedAt: existing ? now() : null
  };
  DB.data.members.push(member);
  if (existing) {
    const invite = DB.data.invites[DB.data.invites.length - 1];
    invite.status = 'accepted';
    notify(existing.id, {
      kind: 'org.invite',
      title: `You were added to ${org.name}`,
      body: `Role: ${ROLE_LABELS[role]}. Open the workspace to see your permissions.`,
      link: `/org/${org.slug}`
    });
  }
  auditLog(org.id, 'team.invited', { email: cleanEmail, role }, actor.id);
  DB.save();
  return member;
}

function changeMemberRole(org, memberId, role, actor) {
  if (!['owner', 'admin'].includes(myRole(org.id))) throw new Error('Only owners and administrators can change roles.');
  const member = memberById(memberId);
  if (!member || member.orgId !== org.id) throw new Error('Team member not found.');
  if (member.role === 'owner') throw new Error('The owner role can only be transferred, not assigned here.');
  if (role === 'owner') throw new Error('Use Transfer ownership instead.');
  if (!['admin', 'manager', 'reviewer', 'staff', 'viewer'].includes(role)) throw new Error('Choose a valid role.');
  if (member.userId === actor.id && role !== 'admin') {
    // An admin may demote themselves, but not to owner; allowed.
  }
  member.role = role;
  auditLog(org.id, 'team.role_changed', { email: member.email, role }, actor.id);
  if (member.userId) {
    notify(member.userId, {
      kind: 'org.role',
      title: `Your role in ${org.name} changed`,
      body: `You are now a ${ROLE_LABELS[role]}.`,
      link: `/org/${org.slug}`
    });
  }
  DB.save();
}

function removeMember(org, memberId, actor) {
  if (!['owner', 'admin'].includes(myRole(org.id))) throw new Error('Only owners and administrators can remove team members.');
  const member = memberById(memberId);
  if (!member || member.orgId !== org.id) throw new Error('Team member not found.');
  if (member.role === 'owner') throw new Error('The owner cannot be removed.');
  if (member.userId === actor.id) throw new Error('You cannot remove yourself. Ask another administrator.');
  member.status = 'removed';
  for (const invite of DB.data.invites) {
    if (invite.orgId === org.id && invite.email === member.email && invite.status === 'pending') invite.status = 'revoked';
  }
  auditLog(org.id, 'team.removed', { email: member.email }, actor.id);
  DB.save();
}

function transferOwnership(org, memberId, actor) {
  if (myRole(org.id) !== 'owner') throw new Error('Only the owner can transfer ownership.');
  const target = memberById(memberId);
  if (!target || target.orgId !== org.id || target.status !== 'active') throw new Error('Choose an active team member.');
  const currentOwner = DB.data.members.find((m) => m.orgId === org.id && m.role === 'owner');
  if (currentOwner) currentOwner.role = 'admin';
  target.role = 'owner';
  org.ownerId = target.userId;
  auditLog(org.id, 'org.ownership_transferred', { to: target.email }, actor.id);
  DB.save();
}

/* ---------------------------------------------------- notifications/events -- */

function notify(userId, { kind, title, body = '', link = '' }) {
  const user = userById(userId);
  if (!user) return null;
  const prefs = user.prefs || {};
  if (kind === 'submission.status' && prefs.notifyApplicationUpdates === false) return null;
  const item = {
    id: id('ntf'), userId, kind, title: String(title).slice(0, 200),
    body: String(body).slice(0, 1500), link, readAt: null, createdAt: now()
  };
  DB.data.notifications.push(item);
  return item;
}

function notifyRoles(orgId, roles, payload, excludeUserId = null) {
  const seen = new Set();
  for (const member of membersFor(orgId)) {
    if (member.status !== 'active' || !member.userId) continue;
    if (excludeUserId && member.userId === excludeUserId) continue;
    if (!roles.includes(member.role) || seen.has(member.userId)) continue;
    seen.add(member.userId);
    notify(member.userId, payload);
  }
  return seen.size;
}

function unreadCount(userId) {
  return DB.data.notifications.filter((n) => n.userId === userId && !n.readAt).length;
}

function addEvent(submissionId, { actorId = null, actorLabel = '', kind, body = '', visibility = 'applicant', from = null, to = null, at = null }) {
  const actor = actorId ? userById(actorId) : null;
  const event = {
    id: id('evt'), submissionId, actorId, actorLabel: actorLabel || (actor ? actor.name : 'System'),
    kind, body: String(body || '').slice(0, 4000), visibility,
    from, to, createdAt: at || now()
  };
  DB.data.events.push(event);
  return event;
}

function eventsFor(submissionId) {
  return DB.data.events
    .filter((e) => e.submissionId === submissionId)
    .sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
}

function auditLog(orgId, action, meta = {}, actorId = (currentUser() || {}).id || null) {
  DB.data.audit.push({
    id: id('aud'), orgId: orgId || null, actorId: actorId || null,
    action, meta, createdAt: now()
  });
  if (DB.data.audit.length > 2000) DB.data.audit.splice(0, DB.data.audit.length - 2000);
}

/* -------------------------------------------------------------- automations -- */

function automationRunsFor(automationId) {
  return DB.data.automationRuns.filter((r) => r.automationId === automationId)
    .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
}

function pickAssignee(orgId, config) {
  if (config.mode === 'user' && config.userId) {
    const member = membershipFor(orgId, config.userId);
    return member ? member.userId : null;
  }
  const candidates = membersFor(orgId).filter(
    (m) => m.status === 'active' && m.userId && ['owner', 'admin', 'manager', 'reviewer'].includes(m.role)
  );
  if (!candidates.length) return null;
  const load = (userId) => DB.data.submissions.filter(
    (s) => s.assignedTo === userId && ['submitted', 'under_review', 'info_required'].includes(s.status)
  ).length;
  return candidates.sort((a, b) => load(a.userId) - load(b.userId))[0].userId;
}

function fillTokens(template, form, submission) {
  return String(template || '').replace(/\{\{(\w+)\}\}/g, (match, key) => {
    const map = {
      form: form.name,
      applicant: submission.applicantName,
      status: (STATUS[submission.status] || {}).label || submission.status,
      reference: submission.id.slice(-6).toUpperCase()
    };
    return map[key] === undefined ? '' : map[key];
  });
}

function runAutomations(form, submission, trigger, actorLabel = 'Automation') {
  const rules = DB.data.automations.filter((a) => a.formId === form.id && a.trigger === trigger && a.active);
  const org = form.orgId ? orgById(form.orgId) : null;
  for (const rule of rules) {
    const cfg = rule.config || {};
    let status = 'ok';
    let detail = '';
    try {
      if (rule.action === 'notify') {
        const roles = Array.isArray(cfg.roles) && cfg.roles.length ? cfg.roles : ['owner', 'admin', 'manager', 'reviewer'];
        const sent = org
          ? notifyRoles(org.id, roles, {
              kind: 'automation.notify',
              title: fillTokens(cfg.title || 'Update on {{form}}', form, submission).slice(0, 200),
              body: fillTokens(cfg.body || '{{applicant}} — {{status}}', form, submission).slice(0, 1200),
              link: org ? `/org/${org.slug}/review/${submission.id}` : `/submissions/${submission.id}`
            }, submission.userId)
          : 0;
        detail = `Notified ${sent} reviewer(s).`;
      } else if (rule.action === 'assign') {
        if (!org) throw new Error('Assignment needs an organization.');
        const userId = pickAssignee(org.id, cfg);
        if (!userId) throw new Error('No reviewer was available to assign.');
        submission.assignedTo = userId;
        submission.updatedAt = now();
        addEvent(submission.id, { kind: 'assigned', actorLabel, body: 'Assigned automatically by a workflow rule.', visibility: 'internal' });
        detail = `Assigned to ${(userById(userId) || {}).name || 'a reviewer'}.`;
      } else if (rule.action === 'set_status') {
        const allowed = trigger === 'submitted' ? ['under_review', 'info_required'] : ['closed'];
        if (!allowed.includes(cfg.status)) throw new Error(`A workflow cannot set "${cfg.status}" on ${trigger}.`);
        submission.status = cfg.status;
        submission.updatedAt = now();
        addEvent(submission.id, {
          kind: 'automation', actorLabel, from: submission.status, to: cfg.status,
          body: 'Status changed by a workflow rule.', visibility: 'system'
        });
        detail = `Status set to ${STATUS[cfg.status].label}.`;
      } else if (rule.action === 'message') {
        addEvent(submission.id, {
          kind: 'message', actorLabel, visibility: 'applicant',
          body: fillTokens(cfg.body || 'Thanks — we have received your application.', form, submission)
        });
        detail = 'Posted an applicant-visible message.';
      } else {
        throw new Error('That action is not available in this build.');
      }
    } catch (error) {
      status = 'failed';
      detail = error.message;
    }
    DB.data.automationRuns.push({
      id: id('run'), automationId: rule.id, submissionId: submission.id,
      status, detail, createdAt: now()
    });
  }
  DB.save();
}

/* ---------------------------------------------------------------- discord -- */

async function sendDiscord(org, content) {
  const url = org && org.discordWebhookUrl;
  if (!url) return { ok: false, reason: 'No Discord webhook is configured for this organization.' };
  try {
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: String(content).slice(0, 1900), allowed_mentions: { parse: [] } })
    });
    if (!response.ok) {
      const text = await response.text().catch(() => '');
      auditLog(org.id, 'discord.webhook_failed', { status: response.status, detail: text.slice(0, 300) });
      DB.save();
      return { ok: false, reason: `Discord answered ${response.status}.` };
    }
    auditLog(org.id, 'discord.webhook_sent', { preview: String(content).slice(0, 120) });
    DB.save();
    return { ok: true };
  } catch (error) {
    auditLog(org.id, 'discord.webhook_failed', { detail: error.message });
    DB.save();
    return { ok: false, reason: 'The browser could not reach Discord. Check the webhook URL and your connection.' };
  }
}

/* ------------------------------------------------------------ router/shell -- */

const ROUTES = [];
let LAST_PATH = null;

function route(pattern, handler) {
  ROUTES.push({ pattern, parts: pattern.split('/').filter(Boolean), handler });
}

function parseHash() {
  const raw = location.hash.replace(/^#/, '') || '/';
  const [pathPart, queryPart] = raw.split('?');
  const path = pathPart.startsWith('/') ? pathPart : `/${pathPart}`;
  return { path: path.replace(/\/+$/, '') || '/', query: new URLSearchParams(queryPart || '') };
}

function matchRoute(path) {
  const segments = path.split('/').filter(Boolean);
  for (const candidate of ROUTES) {
    if (candidate.parts.length !== segments.length) continue;
    const params = {};
    let matched = true;
    for (let i = 0; i < segments.length; i += 1) {
      const part = candidate.parts[i];
      if (part.startsWith(':')) params[part.slice(1)] = decodeURIComponent(segments[i]);
      else if (part !== segments[i]) { matched = false; break; }
    }
    if (matched) return { candidate, params };
  }
  return null;
}

function go(path, { replace = false } = {}) {
  const target = `#${path}`;
  if (location.hash === target) { render(); return; }
  if (replace) {
    try {
      history.replaceState(null, '', target);
      render();
      return;
    } catch { /* file:// in some browsers blocks replaceState */ }
  }
  location.hash = target;
}

function requireUser(returnTo) {
  const user = currentUser();
  if (!user) {
    sessionStorage.setItem('ks_return', returnTo || location.hash.replace(/^#/, '') || '/dashboard');
    go('/login');
    return null;
  }
  return user;
}

function requireOrgAccess(slug, capability = 'org.read') {
  const user = requireUser(`/org/${slug}`);
  if (!user) return null;
  const org = orgBySlug(slug);
  if (!org) { renderNotFound('That workspace does not exist.'); return null; }
  const role = myRole(org.id);
  if (!role) { renderForbidden('You are not a member of that organization.'); return null; }
  if (capability && !can(role, capability)) { renderForbidden('Your role does not include access to that area.'); return null; }
  return { user, org, role };
}

function renderNotFound(message = 'That address does not exist.') {
  document.getElementById('app').innerHTML = shell({
    title: 'Not found',
    body: `<div class="card empty" style="margin-top:1rem"><h2>Page not found</h2><p>${esc(message)}</p><div class="btn-row" style="justify-content:center"><a class="btn" href="#/">Back to the home page</a><a class="btn ghost" href="#/dashboard">Dashboard</a></div></div>`
  });
}

function renderForbidden(message = 'You do not have access to that page.') {
  document.getElementById('app').innerHTML = shell({
    title: 'No access',
    body: `<div class="card empty" style="margin-top:1rem"><h2>No access</h2><p>${esc(message)}</p><div class="btn-row" style="justify-content:center"><a class="btn" href="#/dashboard">Go to dashboard</a></div></div>`
  });
}

async function render() {
  const { path, query } = parseHash();
  const found = matchRoute(path);
  if (!found) { renderNotFound(); return; }
  try {
    const output = await found.candidate.handler(found.params, query);
    if (output === null || output === undefined) return;
    document.getElementById('app').innerHTML = output;
    if (LAST_PATH !== path) {
      window.scrollTo({ top: 0, behavior: 'auto' });
      LAST_PATH = path;
    }
    const main = document.getElementById('main');
    if (main && document.activeElement === document.body) main.focus({ preventScroll: true });
  } catch (error) {
    if (error && error.redirect) { go(error.redirect); return; }
    console.error(error);
    document.getElementById('app').innerHTML = shell({
      title: 'Something went wrong',
      body: `<div class="card" style="margin-top:1rem"><h2>Something went wrong</h2><p class="sub" style="margin:.4rem 0 1rem">${esc(error.message || 'Unknown error')}</p><div class="btn-row"><a class="btn" href="#/">Home</a><button class="btn ghost" data-act="reload">Reload the page</button></div></div>`
    });
  }
}

function navIsActive(path, href) {
  if (href === '/') return path === '/';
  return path === href || path.startsWith(`${href}/`);
}

/* ------------------------------------------------------------- components -- */

function field({ label, name, type = 'text', value = '', required = false, help = '', placeholder = '', autocomplete = '', error = '', min, max, step, disabled = false }) {
  const extra = [
    min !== undefined ? `min="${attr(min)}"` : '',
    max !== undefined ? `max="${attr(max)}"` : '',
    step !== undefined ? `step="${attr(step)}"` : ''
  ].filter(Boolean).join(' ');
  return `<div class="field${error ? ' invalid' : ''}">
    <label for="f-${attr(name)}">${esc(label)}${required ? ' <span aria-hidden="true" style="color:var(--acc)">*</span>' : ''}</label>
    <input id="f-${attr(name)}" name="${attr(name)}" type="${attr(type)}" value="${attr(value)}"
      ${required ? 'required' : ''} ${disabled ? 'disabled' : ''} ${extra}
      placeholder="${attr(placeholder)}" autocomplete="${attr(autocomplete)}"${error ? ' aria-invalid="true" aria-describedby="e-' + attr(name) + '"' : ''}>
    ${help ? `<span class="help">${esc(help)}</span>` : ''}
    ${error ? `<span class="err" id="e-${attr(name)}">${esc(error)}</span>` : ''}
  </div>`;
}

function selectField({ label, name, value = '', options = [], required = false, help = '', error = '', placeholder = '' }) {
  const opts = options.map(([val, text]) =>
    `<option value="${attr(val)}"${String(val) === String(value) ? ' selected' : ''}>${esc(text)}</option>`
  ).join('');
  return `<div class="field${error ? ' invalid' : ''}">
    <label for="f-${attr(name)}">${esc(label)}${required ? ' <span aria-hidden="true" style="color:var(--acc)">*</span>' : ''}</label>
    <select id="f-${attr(name)}" name="${attr(name)}"${required ? ' required' : ''}>
      ${placeholder ? `<option value="">${esc(placeholder)}</option>` : ''}${opts}
    </select>
    ${help ? `<span class="help">${esc(help)}</span>` : ''}
    ${error ? `<span class="err">${esc(error)}</span>` : ''}
  </div>`;
}

function textArea({ label, name, value = '', required = false, help = '', placeholder = '', rows = 4, error = '', maxlength }) {
  return `<div class="field${error ? ' invalid' : ''}">
    <label for="f-${attr(name)}">${esc(label)}${required ? ' <span aria-hidden="true" style="color:var(--acc)">*</span>' : ''}</label>
    <textarea id="f-${attr(name)}" name="${attr(name)}" rows="${attr(rows)}" ${required ? 'required' : ''}
      ${maxlength ? `maxlength="${attr(maxlength)}"` : ''} placeholder="${attr(placeholder)}">${esc(value)}</textarea>
    ${help ? `<span class="help">${esc(help)}</span>` : ''}
    ${error ? `<span class="err">${esc(error)}</span>` : ''}
  </div>`;
}

function checkbox({ label, name, checked = false, help = '', value = 'yes' }) {
  return `<div class="chk">
    <input type="checkbox" id="f-${attr(name)}" name="${attr(name)}" value="${attr(value)}"${checked ? ' checked' : ''}>
    <label for="f-${attr(name)}" style="font-weight:400">${esc(label)}${help ? `<span class="help" style="display:block">${esc(help)}</span>` : ''}</label>
  </div>`;
}

function emptyState({ title, body, action = '' }) {
  return `<div class="empty"><h3>${esc(title)}</h3><p>${esc(body)}</p>${action ? `<div class="btn-row" style="justify-content:center">${action}</div>` : ''}</div>`;
}

function pager({ page, pages, makeHref }) {
  if (pages <= 1) return '';
  const items = [];
  const start = Math.max(1, page - 2);
  const end = Math.min(pages, page + 2);
  if (page > 1) items.push(`<a href="${attr(makeHref(page - 1))}" rel="prev">Previous</a>`);
  if (start > 1) items.push(`<a href="${attr(makeHref(1))}">1</a>`);
  for (let i = start; i <= end; i += 1) {
    items.push(i === page ? `<span class="cur" aria-current="page">${i}</span>` : `<a href="${attr(makeHref(i))}">${i}</a>`);
  }
  if (end < pages) items.push(`<a href="${attr(makeHref(pages))}">${pages}</a>`);
  if (page < pages) items.push(`<a href="${attr(makeHref(page + 1))}" rel="next">Next</a>`);
  return `<nav class="pager" aria-label="Pagination">${items.join('')}</nav>`;
}

function tabs(items, active) {
  return `<nav class="tabs" aria-label="Sections">${items.map(([key, label, href]) =>
    `<a href="${attr(href)}"${key === active ? ' class="on" aria-current="page"' : ''}>${esc(label)}</a>`
  ).join('')}</nav>`;
}

function statBlock({ label, value, note = '' }) {
  return `<div class="stat"><b>${esc(value)}</b><span>${esc(label)}</span>${note ? `<small>${esc(note)}</small>` : ''}</div>`;
}

function answerFor(question, submission) {
  const raw = submission.answers ? submission.answers[question.id] : undefined;
  if (question.type === 'file') {
    const file = raw && raw.data ? raw : null;
    if (!file) return '<span class="a empty-answer">No file attached</span>';
    return `<a class="btn ghost sm" href="${attr(file.data)}" download="${attr(file.name)}">Download ${esc(file.name)} (${bytes(file.size)})</a>`;
  }
  if (Array.isArray(raw)) return raw.length ? esc(raw.join(', ')) : '<span class="empty-answer">No answer</span>';
  if (raw === undefined || raw === null || raw === '') return '<span class="empty-answer">No answer</span>';
  if (question.type === 'checkbox') return raw === 'yes' ? 'Confirmed' : 'Not confirmed';
  return esc(raw);
}

function answerPlain(question, submission) {
  const raw = submission.answers ? submission.answers[question.id] : '';
  if (question.type === 'file') return raw && raw.name ? raw.name : '';
  if (Array.isArray(raw)) return raw.join(', ');
  if (raw === 'yes' && question.type === 'checkbox') return 'Yes';
  return raw || '';
}

function orgSidebar(org, active, user) {
  const role = myRole(org.id);
  const usage = orgUsage(org.id);
  const items = [
    ['overview', 'Overview', `/org/${org.slug}`, ''],
    ['forms', 'Applications', `/org/${org.slug}/forms`, usage.forms],
    ['review', 'Review', `/org/${org.slug}/review`, usage.pending + usage.reviewing + usage.info],
    ['team', 'Team', `/org/${org.slug}/team`, usage.seats]
  ];
  if (can(role, 'form.read')) items.push(['templates', 'Templates', `/org/${org.slug}/templates`, '']);
  if (can(role, 'form.write')) items.push(['automations', 'Automations', `/org/${org.slug}/automations`, '']);
  if (can(role, 'org.integrations')) items.push(['integrations', 'Integrations', `/org/${org.slug}/integrations`, '']);
  if (can(role, 'org.audit')) items.push(['audit', 'Activity log', `/org/${org.slug}/audit`, '']);
  items.push(['settings', 'Settings', `/org/${org.slug}/settings`, '']);

  return `<aside class="side no-print" aria-label="Workspace">
    <div class="side-head">${esc(org.name)}</div>
    ${items.map(([key, label, href, count]) =>
      `<a href="#${href}"${key === active ? ' class="on" aria-current="page"' : ''}><span>${esc(label)}</span>${count ? `<span class="count">${count}</span>` : ''}</a>`
    ).join('')}

    <a href="#/dashboard">Personal dashboard</a>
    <a href="#/orgs">All organizations</a>
  </aside>`;
}

async function demoLogin(role = 'owner') {
  const map = { owner: 'owner@demo.ks', reviewer: 'reviewer@demo.ks', applicant: 'casey@demo.ks' };
  const email = map[role] || map.owner;
  let user = findUserByEmail(email);
  if (!user && !DB.data.users.length) {
    await seedDemo();
    DB.save();
    user = findUserByEmail(email);
  }
  if (!user) throw new Error('The demo workspace is not loaded. Reset it from the admin page.');
  startSession(user);
  toast(`Signed in as ${user.name} (demo)`);
  go(role === 'applicant' ? '/dashboard' : '/org/northgate');
}

/* ---------------------------------------------------------------- helpers -- */

function pageHead(title, lead = '', crumbs = []) {
  return `<div class="page-head">
    ${crumbs.length ? `<div class="crumb">${crumbs.map(([label, href], i) =>
      `${i ? '<span aria-hidden="true">/</span>' : ''}${href ? `<a href="#${href}">${esc(label)}</a>` : esc(label)}`
    ).join('')}</div>` : ''}
    <h1>${esc(title)}</h1>
    ${lead ? `<p class="lead">${esc(lead)}</p>` : ''}
  </div>`;
}

function feature(num, title, body) {
  return `<div class="feat"><div class="n">${esc(num)}</div><h3>${esc(title)}</h3><p>${esc(body)}</p></div>`;
}

function pricingTiers(currentPlan = null) {
  const tiers = [
    {
      id: 'free', name: 'Free', price: 'Free forever', note: 'For one person running a few applications.',
      perks: ['5 applications', 'Unlimited submissions', 'Review inbox and status tracking', 'All templates', 'Discord channel notifications'],
      cta: '<a class="btn ghost block" href="#/register">Start free</a>'
    },
    {
      id: 'business', name: 'Business', price: 'Contact us', note: 'For communities and small teams with their own workspace.',
      perks: ['Organization workspace', '25 applications', 'Up to 10 team members with roles', 'Custom branding and branded pages', 'Workflow automations', 'Audit log and exports'],
      cta: '<a class="btn block" href="#/contact">Talk to us</a>'
    },
    {
      id: 'scale', name: 'Scale', price: 'Contact us', note: 'For larger organizations running several communities.',
      perks: ['Everything in Business', 'Unlimited applications', 'Up to 50 team members', 'Multiple projects and communities', 'Advanced reporting', 'Priority onboarding'],
      cta: '<a class="btn ghost block" href="#/contact">Talk to us</a>'
    }
  ];
  return `<div class="tiers">${tiers.map((t) => `<div class="tier${currentPlan === t.id ? ' cur' : ''}">
    <div class="row between"><h3>${esc(t.name)}</h3>${currentPlan === t.id ? '<span class="tag acc">Current</span>' : ''}</div>
    <div class="big">${esc(t.price)}</div>
    <p class="sub" style="font-size:.88rem">${esc(t.note)}</p>
    <ul class="perks">${t.perks.map((p) => `<li>${esc(p)}</li>`).join('')}</ul>
    ${t.cta}
  </div>`).join('')}</div>`;
}

function templateCard(tpl, { useHref = '#/register' } = {}) {
  const count = (tpl.questions || []).length;
  return `<div class="tpl">
    <div class="row between" style="gap:.4rem"><h3>${esc(tpl.name)}</h3>${kindTag(tpl.kind)}</div>
    <p>${esc(tpl.description)}</p>
    <div class="meta"><span class="sub" style="font-size:.82rem">${plural(count, 'question')}</span></div>
    <a class="btn sm" href="${attr(useHref)}">Use this template</a>
  </div>`;
}

function mySubmissions(userId) {
  return DB.data.submissions
    .filter((s) => s.userId === userId)
    .sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
}

function nextActionFor(sub) {
  switch (sub.status) {
    case 'draft': return 'Finish and submit';
    case 'submitted': return 'Waiting for a reviewer';
    case 'under_review': return 'No action needed';
    case 'info_required': return 'Reply with the requested information';
    case 'approved': return 'Approved — check for next steps';
    case 'rejected': return 'Decision recorded';
    case 'closed': return 'Closed';
    default: return '';
  }
}

route('/dashboard', () => {

route('/applications', (params, query) => {
  const user = requireUser('/applications');
  if (!user) return null;
  const filter = query.get('status') || 'all';
  const all = mySubmissions(user.id);
  const groups = {
    all: all,
    active: all.filter((s) => ['submitted', 'under_review', 'info_required'].includes(s.status)),
    approved: all.filter((s) => s.status === 'approved'),
    rejected: all.filter((s) => s.status === 'rejected'),
    draft: all.filter((s) => s.status === 'draft')
  };
  const rows = groups[filter] || groups.all;

  const tabDefs = [
    ['all', 'All', groups.all.length],
    ['active', 'In progress', groups.active.length],
    ['approved', 'Approved', groups.approved.length],
    ['rejected', 'Rejected', groups.rejected.length],
    ['draft', 'Drafts', groups.draft.length]
  ];

  const body = `
  <div class="page-head">
    <div class="crumb"><a href="#/dashboard">Dashboard</a><span aria-hidden="true">/</span>My applications</div>
    <div class="row between" style="align-items:flex-end">
      <div><h1>My applications</h1><p class="lead">Every application you have started, with its current status and next step.</p></div>
      <a class="btn" href="#/forms/new">New application</a>
    </div>
  </div>
  <nav class="tabs" aria-label="Filter by status">
    ${tabDefs.map(([key, label, count]) => `<a href="#/applications${key === 'all' ? '' : `?status=${key}`}"${filter === key ? ' class="on" aria-current="page"' : ''}>${esc(label)} <span class="faint">${count}</span></a>`).join('')}
  </nav>
  <div class="field" style="max-width:380px">
    <label for="app-search">Search</label>
    <input id="app-search" type="text" placeholder="Form, workspace or status" data-filter="apps">
  </div>
  ${rows.length ? `<div class="tbl-wrap"><table class="tbl" data-filter-list="apps">
    <thead><tr><th>Application</th><th>Workspace</th><th>Status</th><th>Next step</th><th>Updated</th><th></th></tr></thead>
    <tbody>
      ${rows.map((s) => {
        const form = formById(s.formId);
        const org = form && form.orgId ? orgById(form.orgId) : null;
        const href = s.status === 'draft' ? `#/f/${form ? form.slug : ''}?draft=1` : `#/s/${s.publicToken}`;
        return `<tr data-search="${attr(`${form ? form.name : ''} ${org ? org.name : 'Personal'} ${STATUS[s.status].label}`.toLowerCase())}">
          <td><a class="name" href="${attr(href)}">${esc(form ? form.name : 'Application')}</a><div class="sub">${esc(form ? KIND_LABELS[form.kind] || '' : '')} · ref ${esc(s.id.slice(-6).toUpperCase())}</div></td>
          <td>${org ? `<a href="#/org/${attr(org.slug)}">${esc(org.name)}</a>` : '<span class="sub">Personal</span>'}</td>
          <td>${statusPill(s.status)}</td>
          <td class="sub" style="font-size:.85rem">${esc(nextActionFor(s))}</td>
          <td class="sub nowrap">${esc(timeAgo(s.updatedAt))}</td>
          <td><a class="btn ghost sm" href="${attr(href)}">${s.status === 'draft' ? 'Continue' : 'Open'}</a></td>
        </tr>`;
      }).join('')}
    </tbody>
  </table></div>
  <p class="sub" id="app-empty" style="display:none;margin-top:1rem">No applications match that search.</p>` : emptyState({
    title: filter === 'all' ? 'Nothing here yet' : 'No applications in this view',
    body: filter === 'all' ? 'Apply to a community, or create your own application to collect responses.' : 'Try another filter.',
    action: '<a class="btn" href="#/templates">Browse templates</a><a class="btn ghost" href="#/forms/new">Start blank</a>'
  })}`;
  return shell({ title: 'My applications', body });
});

function applicantTimeline(submission, { includeInternal = false } = {}) {
  const events = eventsFor(submission.id).filter((e) => includeInternal || e.visibility === 'applicant');
  if (!events.length) return '<p class="sub" style="font-size:.9rem">No activity yet.</p>';
  return `<div class="timeline">${events.map((e) => {
    const icon = e.kind === 'message' ? '✉' : e.kind === 'status' ? '↔' : e.kind === 'note' ? '✎' : e.kind === 'decision' ? '★' : '•';
    return `<div class="tl${e.visibility === 'internal' ? ' internal' : e.visibility === 'applicant' && e.kind === 'message' ? ' applicant' : ''}">
      <div class="dot" aria-hidden="true">${icon}</div>
      <div class="body">
        <span class="who">${esc(e.actorLabel)}</span><span class="when">${esc(fmtDateTime(e.createdAt))}</span>
        ${e.kind === 'status' && e.to ? `<div style="margin-top:.2rem">${statusPill(e.from || 'submitted')} <span aria-hidden="true">→</span> ${statusPill(e.to)}</div>` : ''}
        ${e.body ? `<p>${esc(e.body)}</p>` : ''}
      </div>
    </div>`;
  }).join('')}</div>`;
}

route('/s/:token', (params) => {
  const sub = DB.data.submissions.find((s) => s.publicToken === params.token);
  if (!sub) return shell({ title: 'Application', body: `<div class="card empty" style="max-width:560px;margin:2rem auto"><h2>Application not found</h2><p>That link is not valid. Check it was copied in full, or open your dashboard.</p><a class="btn" href="#/dashboard">Dashboard</a></div>` });
  const form = formById(sub.formId);
  const org = form && form.orgId ? orgById(form.orgId) : null;
  const user = currentUser();
  const owner = user && sub.userId === user.id;
  const staff = org && user && membershipFor(org.id, user.id);

  if (staff && !owner) {
    return shell({
      title: 'Submission',
      body: `<div class="card" style="max-width:640px;margin:2rem auto"><h2>This is a staff view</h2><p class="sub">You are a member of ${esc(org.name)}. Open the submission in the review dashboard instead.</p><div class="btn-row" style="margin-top:1rem"><a class="btn" href="#/org/${attr(org.slug)}/review/${attr(sub.id)}">Open in review</a></div></div>`
    });
  }

  if (!owner) {
    return shell({
      title: 'Application status',
      body: `<div class="card" style="max-width:560px;margin:2rem auto">
        <span class="tag">${esc(org ? org.name : 'Application')}</span>
        <h1 style="font-size:1.7rem;margin:.6rem 0 .3rem">${esc(form ? form.name : 'Application')}</h1>
        <p class="sub">Reference ${esc(sub.id.slice(-6).toUpperCase())} · submitted ${esc(fmtDate(sub.submittedAt))}</p>
        <div style="margin:1rem 0">${statusPill(sub.status)}</div>
        <div class="notice">Sign in with the account that submitted this application to see messages and reply.</div>
        <div class="btn-row" style="margin-top:1rem"><a class="btn" href="#/login">Log in</a><a class="btn ghost" href="#/register">Create an account</a></div>
      </div>`
    });
  }

  const meta = STATUS[sub.status] || STATUS.submitted;
  const canReply = !['closed', 'draft'].includes(sub.status);
  return shell({
    title: `${form ? form.name : 'Application'} status`,
    body: `<div style="max-width:860px;margin:0 auto">
      <div class="crumb"><a href="#/applications">My applications</a><span aria-hidden="true">/</span>${esc(form ? form.name : 'Application')}</div>
      <div class="card" style="border-color:${sub.status === 'approved' ? 'rgba(76,217,160,.4)' : sub.status === 'rejected' ? 'rgba(255,107,107,.35)' : 'var(--line)'}">
        <div class="row between" style="align-items:flex-start">
          <div>
            <span class="tag">${esc(org ? org.name : 'Personal')}</span>
            <h1 style="font-size:1.8rem;margin:.5rem 0 .2rem">${esc(form ? form.name : 'Application')}</h1>
            <p class="sub">Reference ${esc(sub.id.slice(-6).toUpperCase())} · submitted ${esc(fmtDateTime(sub.submittedAt))}</p>
          </div>
          <div style="text-align:right">${statusPill(sub.status)}<div class="sub" style="font-size:.82rem;margin-top:.4rem">${esc(meta.hint)}</div></div>
        </div>
        ${sub.status === 'info_required' ? '<div class="notice warn mt"><strong>Action needed.</strong> A reviewer has asked for more information. Read the message below and reply.</div>' : ''}
        ${sub.decisionNote && ['approved', 'rejected'].includes(sub.status) ? `<div class="notice ${sub.status === 'approved' ? 'good' : 'bad'} mt"><strong>Reviewer note:</strong> ${esc(sub.decisionNote)}</div>` : ''}
      </div>

      <div class="grid g2" style="margin-top:1rem;align-items:start">
        <div class="card">
          <h3>Your answers</h3>
          <div style="margin-top:.5rem">
            ${questionsFor(form.id).map((q) => `<div class="answer"><div class="q">${esc(q.label)}</div><div class="a">${answerFor(q, sub)}</div></div>`).join('')}
          </div>
          ${sub.status === 'draft' ? `<a class="btn mt" href="#/f/${attr(form.slug)}?draft=1">Continue this draft</a>` : ''}
        </div>
        <div class="stack">
          <div class="card">
            <h3>Activity</h3>
            <div style="margin-top:.6rem">${applicantTimeline(sub)}</div>
          </div>
          ${canReply ? `<div class="card">
            <h3>Message the team</h3>
            <p class="sub" style="font-size:.85rem;margin:.3rem 0 .6rem">Replies are visible to reviewers in ${esc(org ? org.name : 'this application')}.</p>
            <form data-form="applicant-message" data-id="${attr(sub.id)}">
              ${textArea({ label: 'Your message', name: 'body', required: true, rows: 3, placeholder: 'Add the information they asked for, or ask a question.' })}
              <button class="btn" type="submit">Send message</button>
            </form>
          </div>` : ''}
          ${sub.status !== 'closed' ? `<form data-form="withdraw" data-id="${attr(sub.id)}" data-confirm="Withdraw this application? The record stays, but it will be marked closed.">
            <button class="btn danger sm" type="submit">Withdraw application</button>
          </form>` : ''}
        </div>
      </div>
    </div>`
  });
});
