/* ---------------------------------------------------------------- click acts -- */

const ACTIONS = {
  'toggle-nav'(el) {
    const nav = document.getElementById('nav');
    if (!nav) return;
    const open = nav.classList.toggle('open');
    el.setAttribute('aria-expanded', open ? 'true' : 'false');
  },

  logout() { logout(); },

  async 'demo-login'(el) { await demoLogin(el.dataset.role || 'owner'); },

  copy(el) { copyText(el.dataset.text || ''); },

  reload() { location.reload(); },

  'login-return'(el) {
    sessionStorage.setItem('ks_return', el.dataset.path || '/dashboard');
    go('/login');
  },

  async 'form-status'(el) {
    const user = currentUser();
    const form = formById(el.dataset.id);
    if (!form) throw new Error('Application not found.');
    requireFormOwnerOrOrg(form, 'form.publish');
    const status = el.dataset.status;
    if (!FORM_STATUS[status]) throw new Error('Unknown status.');
    if (status === 'published' && questionsFor(form.id).length === 0) throw new Error('Add at least one question before publishing.');
    form.status = status;
    form.updatedAt = now();
    if (status === 'published' && !form.publishedAt) form.publishedAt = now();
    auditLog(form.orgId, status === 'published' ? 'form.published' : status === 'paused' ? 'form.paused' : 'form.closed', { name: form.name }, user.id);
    DB.save();
    flash('good', status === 'published' ? 'Application published. The public link is live.' : status === 'paused' ? 'Application paused.' : 'Application closed.');
    render();
  },

  async 'duplicate-form'(el) {
    const user = currentUser();
    const form = formById(el.dataset.id);
    if (!form) throw new Error('Application not found.');
    requireFormOwnerOrOrg(form, 'form.write');
    let slug = `${form.slug}-copy`;
    let n = 2;
    while (DB.data.forms.some((f) => f.slug === slug && !f.deletedAt)) { slug = `${form.slug}-copy-${n}`; n += 1; }
    const copy = {
      ...JSON.parse(JSON.stringify(form)), id: id('frm'), name: `${form.name} (copy)`, slug,
      status: 'draft', publishedAt: null, createdAt: now(), updatedAt: now()
    };
    DB.data.forms.push(copy);
    for (const q of questionsFor(form.id)) {
      DB.data.questions.push({ ...JSON.parse(JSON.stringify(q)), id: id('q'), formId: copy.id });
    }
    auditLog(copy.orgId, 'form.duplicated', { from: form.id, to: copy.id }, user.id);
    DB.save();
    flash('good', 'Application duplicated as a draft.');
    go(copy.orgId ? `/org/${(orgById(copy.orgId) || {}).slug}/forms/${copy.id}/edit` : `/forms/${copy.id}/edit`);
  },

  async 'save-template'(el) {
    const user = currentUser();
    const form = formById(el.dataset.id);
    if (!form) throw new Error('Application not found.');
    requireFormOwnerOrOrg(form, 'form.write');
    const questions = questionsFor(form.id).map((q) => ({
      label: q.label, type: q.type, required: q.required, options: q.options, help: q.help
    }));
    if (!questions.length) throw new Error('Add at least one question before saving a template.');
    DB.data.templates.push({
      id: id('tpl'), orgId: form.orgId, ownerId: form.orgId ? null : user.id,
      name: `${form.name} template`, kind: form.kind, description: form.description,
      questions, builtin: false, createdAt: now()
    });
    auditLog(form.orgId, 'template.created', { name: form.name }, user.id);
    DB.save();
    flash('good', 'Saved as a template. Find it under Templates.');
    render();
  },

  async 'delete-form'(el) {
    const user = currentUser();
    const form = formById(el.dataset.id);
    if (!form) throw new Error('Application not found.');
    requireFormOwnerOrOrg(form, 'form.delete');
    if (!confirm(`Delete "${form.name}"? The form stops accepting submissions and is hidden. Existing submissions stay available.`)) return;
    form.deletedAt = now();
    form.status = 'closed';
    form.updatedAt = now();
    auditLog(form.orgId, 'form.deleted', { name: form.name }, user.id);
    DB.save();
    flash('good', 'Application deleted.');
    go(form.orgId ? `/org/${(orgById(form.orgId) || {}).slug}/forms` : '/dashboard');
  },

  async claim(el) {
    const user = currentUser();
    const sub = submissionById(el.dataset.id);
    if (!sub) throw new Error('Submission not found.');
    const form = formById(sub.formId);
    if (form.orgId ? !canOrg(form.orgId, 'submission.assign') : form.ownerId !== user.id) throw new Error('You cannot claim this submission.');
    sub.assignedTo = user.id;
    sub.updatedAt = now();
    addEvent(sub.id, { actorId: user.id, actorLabel: user.name, kind: 'assigned', body: 'Claimed this review.', visibility: 'internal' });
    if (form.orgId) auditLog(form.orgId, 'submission.assigned', { submission: sub.id, userId: user.id }, user.id);
    DB.save();
    flash('good', 'Assigned to you.');
    render();
  },

  async 'quick-decide'(el) {
    const user = currentUser();
    const sub = submissionById(el.dataset.id);
    if (!sub) throw new Error('Submission not found.');
    const form = formById(sub.formId);
    if (form.orgId ? !canOrg(form.orgId, 'submission.decide') : form.ownerId !== user.id) throw new Error('You cannot decide this submission.');
    const status = el.dataset.status;
    if (status === 'closed') {
      applyStatusChange(sub, 'closed', 'Closed by a reviewer.', user);
    } else {
      const label = STATUS[status].label;
      const note = prompt(`Note for the applicant (required to ${label.toLowerCase()}):`, '');
      if (note === null) return;
      if (!note.trim()) { toast('A note is required for this decision.', 'bad'); return; }
      applyStatusChange(sub, status, note, user);
    }
    flash('good', 'Status updated.');
    render();
  },

  'export-csv'(el) {
    const form = formById(el.dataset.formId);
    if (!form) throw new Error('Application not found.');
    if (!canReadForm(form)) throw new Error('You cannot export this application.');
    const subs = DB.data.submissions.filter((s) => s.formId === form.id && s.status !== 'draft');
    download(`${form.slug}-submissions.csv`, submissionsCsv(form, subs), 'text/csv');
    toast(`Exported ${plural(subs.length, 'submission')}.`);
  },

  'export-org-csv'(el) {
    const org = orgById(el.dataset.org);
    if (!org) throw new Error('Workspace not found.');
    if (!canOrg(org.id, 'submission.export')) throw new Error('You cannot export this workspace.');
    const subs = orgSubmissions(org.id).filter((s) => s.status !== 'draft');
    const rows = [['Reference', 'Application', 'Applicant', 'Email', 'Discord ID', 'Status', 'Submitted', 'Assigned to', 'Decision note', 'Answers']];
    for (const s of subs) {
      const form = formById(s.formId);
      rows.push([
        s.id.slice(-6).toUpperCase(), form ? form.name : '', s.applicantName, s.applicantEmail, s.discordId || '',
        (STATUS[s.status] || {}).label || s.status, s.submittedAt || '',
        s.assignedTo ? (userById(s.assignedTo) || {}).name || '' : '', s.decisionNote || '',
        JSON.stringify(s.answers || {})
      ]);
    }
    download(`${org.slug}-submissions.csv`, toCsv(rows), 'text/csv');
    toast(`Exported ${plural(subs.length, 'submission')}.`);
  },

  'export-data'() {
    const user = currentUser();
    if (!user) throw new Error('Sign in first.');
    const orgIds = new Set(myOrgs().map((o) => o.id));
    const formIds = new Set(DB.data.forms.filter((f) => f.ownerId === user.id || orgIds.has(f.orgId)).map((f) => f.id));
    const payload = {
      exportedAt: now(),
      account: { name: user.name, email: user.email, discordId: user.discordId, createdAt: user.createdAt, prefs: user.prefs },
      organizations: myOrgs().map((o) => ({ name: o.name, slug: o.slug, role: myRole(o.id), plan: o.plan })),
      forms: DB.data.forms.filter((f) => formIds.has(f.id)).map((f) => ({
        ...f, questions: questionsFor(f.id)
      })),
      submissions: DB.data.submissions.filter((s) => s.userId === user.id || formIds.has(s.formId)),
      notifications: DB.data.notifications.filter((n) => n.userId === user.id)
    };
    download('ks-applications-data.json', JSON.stringify(payload, null, 2), 'application/json');
    toast('Your data was downloaded.');
  },

  'export-platform'() {
    const admin = requireAdmin();
    if (!admin) throw new Error('Not allowed.');
    const clone = JSON.parse(JSON.stringify(DB.data));
    clone.users = clone.users.map((u) => {
      const { salt, passwordHash, ...rest } = u;
      return rest;
    });
    clone.sessions = {};
    download('ks-applications-platform.json', JSON.stringify(clone, null, 2), 'application/json');
    toast('Platform export downloaded.');
  },

  async 'remove-member'(el) {
    const user = currentUser();
    const member = memberById(el.dataset.id);
    if (!member) throw new Error('Team member not found.');
    const org = orgById(member.orgId);
    if (!org) throw new Error('Workspace not found.');
    if (!confirm(`Remove ${el.dataset.name || member.email} from ${org.name}?`)) return;
    removeMember(org, member.id, user);
    flash('good', 'Team member removed.');
    render();
  },

  async 'revoke-invite'(el) {
    const user = currentUser();
    const invite = DB.data.invites.find((i) => i.id === el.dataset.id);
    if (!invite) throw new Error('Invitation not found.');
    const org = orgById(invite.orgId);
    if (!org || !canOrg(org.id, 'org.team.write')) throw new Error('You cannot revoke this invitation.');
    if (!confirm('Revoke this invitation?')) return;
    invite.status = 'revoked';
    const member = DB.data.members.find((m) => m.orgId === invite.orgId && m.email === invite.email && m.status === 'invited');
    if (member) member.status = 'removed';
    auditLog(org.id, 'team.removed', { email: invite.email, revoked: true }, user.id);
    DB.save();
    flash('good', 'Invitation revoked.');
    render();
  },

  async 'toggle-automation'(el) {
    const user = currentUser();
    const rule = DB.data.automations.find((a) => a.id === el.dataset.id);
    if (!rule) throw new Error('Automation not found.');
    const form = formById(rule.formId);
    if (!form || !canEditForm(form)) throw new Error('You cannot change this automation.');
    rule.active = !rule.active;
    auditLog(form.orgId, 'form.updated', { automation: rule.id, active: rule.active }, user.id);
    DB.save();
    flash('good', rule.active ? 'Automation enabled.' : 'Automation paused.');
    render();
  },

  async 'delete-automation'(el) {
    const user = currentUser();
    const rule = DB.data.automations.find((a) => a.id === el.dataset.id);
    if (!rule) throw new Error('Automation not found.');
    const form = formById(rule.formId);
    if (!form || !canEditForm(form)) throw new Error('You cannot delete this automation.');
    if (!confirm('Delete this automation?')) return;
    DB.data.automations = DB.data.automations.filter((a) => a.id !== rule.id);
    DB.data.automationRuns = DB.data.automationRuns.filter((r) => r.automationId !== rule.id);
    auditLog(form.orgId, 'form.updated', { automation: 'deleted' }, user.id);
    DB.save();
    flash('good', 'Automation deleted.');
    render();
  },

  async 'delete-template'(el) {
    const user = currentUser();
    const template = DB.data.templates.find((t) => t.id === el.dataset.id);
    if (!template || template.builtin) throw new Error('That template cannot be deleted.');
    if (template.orgId && !canOrg(template.orgId, 'form.write')) throw new Error('You cannot delete this template.');
    if (!template.orgId && template.ownerId !== user.id) throw new Error('You cannot delete this template.');
    if (!confirm('Delete this template? Forms created from it are not affected.')) return;
    DB.data.templates = DB.data.templates.filter((t) => t.id !== template.id);
    auditLog(template.orgId, 'template.deleted', {}, user.id);
    DB.save();
    flash('good', 'Template deleted.');
    render();
  },

  async 'test-discord'(el) {
    const user = currentUser();
    const org = (el.dataset.org ? orgById(el.dataset.org) : null) || (parseHash().path.split('/')[2] ? orgBySlug(parseHash().path.split('/')[2]) : null);
    if (!org) throw new Error('Workspace not found.');
    if (!canOrg(org.id, 'org.integrations')) throw new Error('You cannot test integrations.');
    if (!org.discordWebhookUrl) throw new Error('Save a Discord webhook first.');
    const result = await sendDiscord(org, `**KS Applications test** — notifications for ${org.name} are working. Sent by ${user.name}.`);
    toast(result.ok ? 'Discord accepted the test message.' : result.reason, result.ok ? 'good' : 'bad');
    render();
  },

  async 'reset-demo'() {
    if (!confirm('Reset all data back to the demo workspace? Any changes you made will be lost.')) return;
    DB.reset({ demo: true });
    await seedDemo();
    DB.save();
    go('/');
    toast('Demo data reset.');
  },

  async 'clear-data'() {
    if (!confirm('Delete every account, workspace, application and submission in this browser?')) return;
    if (!confirm('This cannot be undone. Export first if you need a copy. Continue?')) return;
    DB.reset({ demo: false });
    go('/');
    toast('All data cleared.');
  },

  async 'load-demo'() {
    if (DB.data.users.length) throw new Error('Clear the existing data first.');
    DB.reset({ demo: true });
    await seedDemo();
    DB.save();
    toast('Demo workspace loaded.');
    go('/login');
  },

  async 'admin-user-role'(el) {
    const admin = requireAdmin();
    if (!admin) throw new Error('Not allowed.');
    const target = userById(el.dataset.id);
    if (!target) throw new Error('User not found.');
    if (target.id === admin.id) throw new Error('You cannot change your own platform role.');
    const role = el.dataset.role;
    if (!['admin', 'user'].includes(role)) throw new Error('Unknown role.');
    if (role === 'user') {
      const admins = DB.data.users.filter((u) => u.platformRole === 'admin' && !u.deletedAt).length;
      if (admins <= 1) throw new Error('Keep at least one platform administrator.');
    }
    target.platformRole = role;
    auditLog(null, role === 'admin' ? 'admin.granted' : 'admin.revoked', { user: target.email }, admin.id);
    DB.save();
    flash('good', role === 'admin' ? 'Administrator access granted.' : 'Administrator access removed.');
    render();
  },

  async 'admin-user-status'(el) {
    const admin = requireAdmin();
    if (!admin) throw new Error('Not allowed.');
    const target = userById(el.dataset.id);
    if (!target) throw new Error('User not found.');
    if (target.id === admin.id) throw new Error('You cannot suspend your own account.');
    const status = el.dataset.status;
    if (!['active', 'suspended'].includes(status)) throw new Error('Unknown status.');
    target.status = status;
    if (status === 'suspended') {
      for (const [token, session] of Object.entries(DB.data.sessions)) {
        if (session.userId === target.id) delete DB.data.sessions[token];
      }
    }
    auditLog(null, status === 'suspended' ? 'admin.user_suspended' : 'admin.user_restored', { user: target.email }, admin.id);
    DB.save();
    flash('good', status === 'suspended' ? 'Account suspended and signed out.' : 'Account restored.');
    render();
  },

  async 'admin-support'(el) {
    const admin = requireAdmin();
    if (!admin) throw new Error('Not allowed.');
    const request = DB.data.support.find((r) => r.id === el.dataset.id);
    if (!request) throw new Error('Request not found.');
    request.status = el.dataset.status;
    request.updatedAt = now();
    auditLog(null, 'support.status_changed', { id: request.id, status: request.status }, admin.id);
    DB.save();
    flash('good', 'Support request updated.');
    render();
  }
};

/* ------------------------------------------------------------- autosave/draft -- */

let autosaveTimer = null;

function collectDraftAnswers(formEl) {
  const questions = questionsFor(formEl.dataset.id);
  const fd = new FormData(formEl);
  const answers = {};
  for (const q of questions) {
    if (q.type === 'file') continue;
    if (q.type === 'multiselect') answers[q.id] = fd.getAll(`q_${q.id}`).map(String);
    else if (q.type === 'checkbox') answers[q.id] = fd.get(`q_${q.id}`) === 'yes' ? 'yes' : 'no';
    else answers[q.id] = String(fd.get(`q_${q.id}`) || '');
  }
  return answers;
}

function saveDraftNow(formEl) {
  const user = currentUser();
  if (!user) return;
  const form = formById(formEl.dataset.id);
  if (!form || form.status !== 'published') return;
  let draft = DB.data.submissions.find((s) => s.formId === form.id && s.userId === user.id && s.status === 'draft');
  if (!draft) {
    draft = {
      id: id('sub'), formId: form.id, userId: user.id, applicantName: user.name,
      applicantEmail: user.email, discordId: user.discordId || '', answers: {}, status: 'draft',
      source: 'web', assignedTo: null, decidedBy: null, decidedAt: null, decisionNote: '',
      publicToken: randomToken(), createdAt: now(), updatedAt: now(), submittedAt: null
    };
    DB.data.submissions.push(draft);
  }
  draft.answers = collectDraftAnswers(formEl);
  draft.updatedAt = now();
  DB.save();
  const note = document.getElementById('autosave-note');
  if (note) note.textContent = 'Draft saved just now.';
}

function scheduleAutosave(target) {
  const formEl = target.closest('form[data-autosave]');
  if (!formEl) return;
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(() => {
    try { saveDraftNow(formEl); }
    catch (error) { console.warn('Draft could not be saved', error); }
  }, 900);
}

/* ------------------------------------------------------------------- wiring -- */

document.addEventListener('click', async (event) => {
  const target = event.target.closest('[data-act]');
  if (!target) return;
  const action = target.dataset.act;
  if (target.dataset.confirm && !confirm(target.dataset.confirm)) return;
  if (action === 'toggle-nav') {
    ACTIONS['toggle-nav'](target);
    return;
  }
  const handler = ACTIONS[action];
  if (!handler) return;
  event.preventDefault();
  try {
    await handler(target);
  } catch (error) {
    console.error(error);
    toast(error.message || 'Something went wrong.', 'bad');
  }
});

document.addEventListener('submit', async (event) => {
  const formEl = event.target;
  if (!(formEl instanceof HTMLFormElement) || !formEl.dataset.form) return;
  event.preventDefault();
  if (formEl.dataset.confirm && !confirm(formEl.dataset.confirm)) return;
  const handler = FORMS[formEl.dataset.form];
  if (!handler) return;
  const submitter = event.submitter || null;
  if (submitter) submitter.disabled = true;
  try {
    await handler(formEl, submitter);
  } catch (error) {
    console.error(error);
    toast(error.message || 'Something went wrong.', 'bad');
  } finally {
    if (submitter && submitter.isConnected) submitter.disabled = false;
  }
});

document.addEventListener('input', (event) => {
  const target = event.target;
  if (target.matches('[data-filter]')) {
    const key = target.dataset.filter;
    const list = document.querySelector(`[data-filter-list="${key}"]`);
    if (list) {
      const term = target.value.trim().toLowerCase();
      let visible = 0;
      for (const row of list.querySelectorAll('tbody tr')) {
        const match = !term || (row.dataset.search || '').includes(term);
        row.hidden = !match;
        if (match) visible += 1;
      }
      const empty = document.getElementById('app-empty');
      if (empty) empty.style.display = visible ? 'none' : 'block';
    }
  }
  if (target.closest('form[data-autosave]')) scheduleAutosave(target);
});

document.addEventListener('change', (event) => {
  if (event.target.closest('form[data-autosave]')) scheduleAutosave(event.target);
});

document.addEventListener('keydown', (event) => {
  if (event.key !== 'Escape') return;
  const nav = document.getElementById('nav');
  if (nav && nav.classList.contains('open')) {
    nav.classList.remove('open');
    const button = document.querySelector('[data-act="toggle-nav"]');
    if (button) button.setAttribute('aria-expanded', 'false');
  }
});

/* --------------------------------------------------------------------- boot -- */

async function boot() {
  DB.load();
  ensureTemplates();
  const initialised = storage.getItem('ks_initialized');
  if (!initialised) {
    if (!DB.data.users.length) {
      await seedDemo();
      DB.save();
    }
    storage.setItem('ks_initialized', '1');
  } else {
    DB.save();
  }
  window.addEventListener('hashchange', () => {
    const nav = document.getElementById('nav');
    if (nav) nav.classList.remove('open');
    render();
  });
  await render();
}

boot();
</script>
