/* ------------------------------------------------------------------ builder -- */

function builderPath(form, org) {
  return org ? `/org/${org.slug}/forms/${form.id}/edit` : `/forms/${form.id}/edit`;
}

function formPublicPath(form) { return `/f/${form.slug}`; }

function questionEditor(question, index, total) {
  const options = (question.options || []).join(', ');
  return `<div class="qcard" data-qrow="${attr(question.id)}">
    <div class="qcard-head">
      <div class="row" style="gap:.5rem"><span class="qnum">${index + 1}</span>
        <span class="sub" style="font-size:.82rem">${esc(QUESTION_TYPES[question.type] || question.type)}</span></div>
      <div class="qcard-actions">
        <button class="btn ghost sm" type="submit" name="action" value="up:${attr(question.id)}"${index === 0 ? ' disabled' : ''} aria-label="Move question up">↑</button>
        <button class="btn ghost sm" type="submit" name="action" value="down:${attr(question.id)}"${index === total - 1 ? ' disabled' : ''} aria-label="Move question down">↓</button>
        <button class="btn danger sm" type="submit" name="action" value="delete:${attr(question.id)}" data-confirm="Delete this question? Answers already collected for it stay in the record but will no longer be shown.">Delete</button>
      </div>
    </div>
    <div class="qgrid">
      <div class="field" style="margin:0">
        <label for="l-${attr(question.id)}">Question</label>
        <input id="l-${attr(question.id)}" type="text" name="label__${attr(question.id)}" value="${attr(question.label)}" required maxlength="200">
      </div>
      <div class="field" style="margin:0">
        <label for="t-${attr(question.id)}">Type</label>
        <select id="t-${attr(question.id)}" name="type__${attr(question.id)}">
          ${Object.entries(QUESTION_TYPES).map(([value, label]) => `<option value="${attr(value)}"${value === question.type ? ' selected' : ''}>${esc(label)}</option>`).join('')}
        </select>
      </div>
      <div class="field" style="margin:0">
        <span class="lbl">Required</span>
        <label class="chk" style="margin-top:.55rem"><input type="checkbox" name="required__${attr(question.id)}"${question.required ? ' checked' : ''}> Must answer</label>
      </div>
      <div class="field qopts" style="margin:0">
        <label for="o-${attr(question.id)}">Choices <span class="help">(comma separated, only for dropdown and multiple choice)</span></label>
        <input id="o-${attr(question.id)}" type="text" name="options__${attr(question.id)}" value="${attr(options)}" placeholder="Option one, Option two">
      </div>
      <div class="field qopts" style="margin:0">
        <label for="h-${attr(question.id)}">Help text <span class="help">(optional)</span></label>
        <input id="h-${attr(question.id)}" type="text" name="help__${attr(question.id)}" value="${attr(question.help || '')}" maxlength="300">
      </div>
    </div>
  </div>`;
}

function renderBuilder(form, org) {
  const user = currentUser();
  const role = org ? myRole(org.id) : 'owner';
  const questions = questionsFor(form.id);
  const base = org ? `/org/${org.slug}` : '';
  const subs = DB.data.submissions.filter((s) => s.formId === form.id && s.status !== 'draft');
  const openCount = subs.filter((s) => ['submitted', 'under_review', 'info_required'].includes(s.status)).length;
  const canPublish = can(role, 'form.publish');
  const canDelete = can(role, 'form.delete');

  const body = `
  <div class="crumb">${org ? `<a href="#${base}">${esc(org.name)}</a><span aria-hidden="true">/</span><a href="#${base}/forms">Applications</a>` : '<a href="#/dashboard">Dashboard</a>'}<span aria-hidden="true">/</span>${esc(form.name)}</div>
  <div class="row between" style="align-items:flex-end;margin-bottom:1rem">
    <div>
      <div class="row" style="gap:.5rem"><h1 style="font-size:1.8rem">${esc(form.name)}</h1>${formPill(form.status)}</div>
      <p class="sub">${questions.length} questions · ${subs.length} submissions · ${openCount} open</p>
    </div>
    <div class="btn-row">
      <a class="btn ghost" href="#${builderPath(form, org).replace('/edit', '')}">Overview</a>
      <a class="btn ghost" href="#${org ? `${base}/review?form=${attr(form.id)}` : `/forms/${attr(form.id)}/review`}">Review</a>
      ${form.status === 'published' ? `<a class="btn ghost" href="#${formPublicPath(form)}" target="_blank" rel="noopener">Open public form</a>` : ''}
    </div>
  </div>

  <div class="split">
    <form data-form="builder" data-id="${attr(form.id)}" novalidate>
      <div class="card">
        <h3>Application settings</h3>
        <div style="margin-top:.7rem">
          ${field({ label: 'Name', name: 'name', value: form.name, required: true })}
          <div class="inline-fields">
            ${field({ label: 'Public address', name: 'slug', value: form.slug, required: true, help: 'Letters, numbers and dashes.' })}
            ${selectField({ label: 'Type', name: 'kind', value: form.kind, options: Object.entries(KIND_LABELS) })}
          </div>
          ${textArea({ label: 'Description', name: 'description', value: form.description, rows: 3, help: 'Shown at the top of the public form.' })}
          ${textArea({ label: 'Instructions', name: 'instructions', value: form.instructions, rows: 3, help: 'Optional guidance shown above the questions.' })}
          ${textArea({ label: 'Confirmation message', name: 'confirmationMessage', value: form.confirmationMessage, rows: 2, help: 'Shown after someone submits.' })}
          <div class="inline-fields">
            ${field({ label: 'Closes at', name: 'closesAt', type: 'datetime-local', value: toLocalInput(form.closesAt), help: 'Optional. The form stops accepting submissions after this time.' })}
            ${field({ label: 'Submissions allowed per person', name: 'maxPerUser', type: 'number', value: form.maxPerUser, min: 1, max: 20 })}
          </div>
          ${checkbox({ label: 'Allow the same person to submit more than once', name: 'allowMultiple', checked: !!form.allowMultiple, help: 'Leave off for most applications. Duplicate protection is on by default.' })}
        </div>
      </div>

      <div class="card" style="margin-top:1rem">
        <div class="row between"><h3>Questions</h3><span class="tag">${questions.length}</span></div>
        <div style="margin-top:.8rem">
          ${questions.length ? questions.map((q, i) => questionEditor(q, i, questions.length)).join('') : '<div class="empty" style="padding:1.4rem"><p>No questions yet. Add the first one below.</p></div>'}
        </div>
        <div class="btn-row" style="margin-top:.8rem">
          <button class="btn soft" type="submit" name="action" value="add">Add question</button>
          <button class="btn" type="submit" name="action" value="save">Save changes</button>
        </div>
      </div>
    </form>

    <div class="stack">
      <div class="card">
        <h3>Publishing</h3>
        <p class="sub" style="font-size:.88rem;margin:.4rem 0 .7rem">${form.status === 'published' ? 'This form is live. Applicants can submit right now.' : form.status === 'draft' ? 'Only you can see this form. Publish it when the questions are ready.' : form.status === 'paused' ? 'The public page is hidden. Existing submissions are kept.' : 'This form is closed and no longer accepts submissions.'}</p>
        <div class="btn-row">
          ${canPublish && form.status !== 'published' ? `<button class="btn" data-act="form-status" data-id="${attr(form.id)}" data-status="published">${form.status === 'closed' ? 'Reopen' : 'Publish'}</button>` : ''}
          ${canPublish && form.status === 'published' ? `<button class="btn ghost" data-act="form-status" data-id="${attr(form.id)}" data-status="paused">Pause</button>` : ''}
          ${canPublish && form.status !== 'closed' ? `<button class="btn ghost" data-act="form-status" data-id="${attr(form.id)}" data-status="closed">Close</button>` : ''}
        </div>
        ${form.status === 'published' ? `<div class="code" style="margin-top:.8rem"><span>${esc(linkTo(formPublicPath(form)))}</span><button class="copy" data-act="copy" data-text="${attr(linkTo(formPublicPath(form)))}">Copy</button></div>` : ''}
      </div>

      <div class="card">
        <h3>Automations</h3>
        <p class="sub" style="font-size:.88rem;margin:.4rem 0 .6rem">${org ? 'Route new submissions, notify reviewers and post confirmations automatically.' : 'Automations are available inside an organization workspace.'}</p>
        ${org ? `<a class="btn ghost sm" href="#${base}/automations?form=${attr(form.id)}">Manage automations</a>` : `<a class="btn ghost sm" href="#/org/new">Create a workspace</a>`}
      </div>

      <div class="card">
        <h3>Templates and copies</h3>
        <div class="btn-row" style="margin-top:.5rem">
          <button class="btn ghost sm" data-act="duplicate-form" data-id="${attr(form.id)}">Duplicate</button>
          <button class="btn ghost sm" data-act="save-template" data-id="${attr(form.id)}">Save as template</button>
          ${canDelete ? `<button class="btn danger sm" data-act="delete-form" data-id="${attr(form.id)}" data-name="${attr(form.name)}">Delete</button>` : ''}
        </div>
        <p class="sub" style="font-size:.8rem;margin-top:.6rem">Deleting hides the form and stops submissions. Existing submissions stay available to the team.</p>
      </div>

      <div class="card">
        <h3>Tips</h3>
        <ul class="perks" style="margin-top:.4rem">
          <li>Keep required questions to what you will actually use.</li>
          <li>Explain what happens after submitting.</li>
          <li>Use a deadline instead of closing manually.</li>
          <li>Ask for a link rather than sensitive documents.</li>
        </ul>
      </div>
    </div>
  </div>`;
  return shell({ title: `Edit ${form.name}`, body, wide: true });
}

route('/forms/:id', (params) => {

    <div class="row between mb">

route('/forms/:id/edit', (params) => {
  const user = requireUser();
  if (!user) return null;
  const form = formById(params.id);
  if (!form || form.deletedAt) { renderNotFound('That application does not exist.'); return null; }

function questionInput(question, value, disabled = false) {
  const name = `q_${question.id}`;
  const common = `id="q-${attr(question.id)}" name="${attr(name)}"${question.required ? ' required' : ''}${disabled ? ' disabled' : ''}`;
  const help = question.help ? `<span class="help">${esc(question.help)}</span>` : '';
  const label = `<label for="q-${attr(question.id)}">${esc(question.label)}${question.required ? ' <span aria-hidden="true" style="color:var(--acc)">*</span>' : ''}</label>`;

  if (question.type === 'long') {
    return `<div class="field">${label}${help}<textarea ${common} rows="5">${esc(value || '')}</textarea></div>`;
  }
  if (question.type === 'select') {
    return `<div class="field">${label}${help}<select ${common}><option value="">Choose one…</option>${(question.options || []).map((o) => `<option value="${attr(o)}"${o === value ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select></div>`;
  }
  if (question.type === 'multiselect') {
    const chosen = Array.isArray(value) ? value : [];
    return `<fieldset class="field" style="border:0"><legend class="lbl" style="margin-bottom:.4rem">${esc(question.label)}${question.required ? ' <span aria-hidden="true" style="color:var(--acc)">*</span>' : ''}</legend>${help}
      ${(question.options || []).map((o, i) => `<label class="chk"><input type="checkbox" name="${attr(name)}" value="${attr(o)}"${chosen.includes(o) ? ' checked' : ''}${disabled ? ' disabled' : ''}> ${esc(o)}</label>`).join('')}
    </fieldset>`;
  }
  if (question.type === 'checkbox') {
    return `<div class="field"><label class="chk" style="font-weight:500"><input type="checkbox" ${common} value="yes"${value === 'yes' ? ' checked' : ''}> ${esc(question.label)}${question.required ? ' <span aria-hidden="true" style="color:var(--acc)">*</span>' : ''}</label>${help}</div>`;
  }
  if (question.type === 'file') {
    return `<div class="field">${label}${help}<input type="file" ${common} accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.txt"${disabled ? ' disabled' : ''}><span class="help">PDF, DOCX, PNG, JPEG or TXT up to 300 KB.</span></div>`;
  }
  const type = question.type === 'number' ? 'number' : question.type === 'email' ? 'email' : question.type === 'url' ? 'url' : 'text';
  return `<div class="field">${label}${help}<input type="${type}" ${common} value="${attr(value || '')}"${question.type === 'url' ? ' placeholder="https://"' : ''}></div>`;
}

function renderPublicForm(form, org, user, { errors = {}, values = {}, draft = null, message = '' } = {}) {
  const questions = questionsFor(form.id);
  const existing = user ? DB.data.submissions.filter((s) => s.formId === form.id && s.userId === user.id && s.status !== 'draft') : [];
  const submitted = existing.length > 0 && (!form.allowMultiple || existing.length >= (form.maxPerUser || 1));
  const closed = form.status !== 'published' || (form.closesAt && new Date(form.closesAt) < new Date());
  const color = (org && org.brandColor) || '#c8f542';
  const answers = values && Object.keys(values).length ? values : (draft ? draft.answers : {});

  if (closed) {
    const owner = user && (form.ownerId === user.id || (org && membershipFor(org.id, user.id)));
    return shell({
      title: form.name,
      body: `<div class="card empty" style="max-width:620px;margin:2rem auto">
        <span class="tag">${esc(org ? org.name : 'Application')}</span>
        <h2 style="margin-top:.6rem">${form.status === 'closed' ? 'This application is closed' : form.status === 'paused' ? 'This application is paused' : 'This application is not open yet'}</h2>
        <p>${form.closesAt && new Date(form.closesAt) < new Date() ? `It closed on ${esc(fmtDateTime(form.closesAt))}.` : 'The team is not accepting submissions at the moment.'}</p>
        ${owner ? `<a class="btn ghost" href="#${builderPath(form, org)}">Manage application</a>` : '<a class="btn" href="#/dashboard">Go to dashboard</a>'}
      </div>`
    });
  }

  const body = `<div style="max-width:820px;margin:0 auto;--org:${attr(color)}">
    <div class="brandbar"></div>
    <div class="row between" style="align-items:flex-start;margin-bottom:1rem">
      <div class="row" style="gap:.7rem">
        ${org ? orgMark(org) : `<span class="org-mark" style="background:${attr(color)}">${esc(initials(APP.name))}</span>`}
        <div><div class="sub" style="font-size:.85rem">${esc(org ? org.name : APP.studio)}</div><h1 style="font-size:1.7rem">${esc(form.name)}</h1></div>
      </div>
      <span class="tag">${esc(KIND_LABELS[form.kind])}</span>
    </div>
    ${form.description ? `<p class="lead" style="margin-bottom:.7rem">${esc(form.description)}</p>` : ''}
    ${form.instructions ? `<div class="notice" style="margin-bottom:1rem">${esc(form.instructions)}</div>` : ''}
    ${form.closesAt ? `<p class="sub" style="font-size:.85rem;margin-bottom:1rem">Closes ${esc(fmtDateTime(form.closesAt))}</p>` : ''}

    ${message ? `<div class="flash bad">${esc(message)}</div>` : ''}

    ${!user ? `<div class="card" style="margin-bottom:1rem">
      <div class="row between" style="flex-wrap:wrap;gap:.6rem">
        <div><h3 style="font-size:1rem">Sign in to apply</h3><p class="sub" style="font-size:.88rem">Applications are tied to an account so you can track your status and receive replies.</p></div>
        <div class="btn-row"><a class="btn" href="#/login?next=${encodeURIComponent(formPublicPath(form))}">Log in</a><a class="btn ghost" href="#/register">Create an account</a></div>
      </div>
    </div>` : ''}

    ${submitted ? `<div class="card" style="margin-bottom:1rem;border-color:rgba(76,217,160,.35)">
      <h3>You have already applied</h3>
      <p class="sub" style="font-size:.9rem;margin:.3rem 0 .7rem">This application accepts ${form.allowMultiple ? `${form.maxPerUser} submissions` : 'one submission'} per person.</p>
      <a class="btn" href="#/s/${attr(existing[0].publicToken)}">View your status</a>
    </div>` : ''}

    <form class="card" data-form="submit-application" data-id="${attr(form.id)}" data-autosave="1" novalidate>
      ${questions.map((q) => `<div${errors[q.id] ? ' class="field invalid"' : ''}>${questionInput(q, answers[q.id], !user || submitted)}
        ${errors[q.id] ? `<span class="err" style="display:block;margin-top:-.5rem;margin-bottom:.8rem">${esc(errors[q.id])}</span>` : ''}
      </div>`).join('')}
      ${user && !submitted ? `<div class="form-actions">
        <button class="btn" type="submit" name="intent" value="submit">Submit application</button>
        <button class="btn ghost" type="submit" name="intent" value="draft">Save draft</button>
        <span class="sub" style="font-size:.82rem" id="autosave-note">${draft ? 'Draft loaded.' : 'Answers save automatically once you start.'}</span>
      </div>` : ''}
      ${!user ? '<div class="form-actions"><a class="btn" href="#/login?next=' + encodeURIComponent(formPublicPath(form)) + '">Log in to submit</a></div>' : ''}
    </form>
    <p class="sub" style="font-size:.8rem;text-align:center;margin-top:1rem">Your answers are shared with ${esc(org ? org.name : 'the application owner')} only.</p>
  </div>`;
  return shell({ title: form.name, body });
}

route('/f/:slug', (params, query) => {
  const form = DB.data.forms.find((f) => f.slug === params.slug && !f.deletedAt);
  if (!form) return shell({ title: 'Not found', body: `<div class="card empty" style="max-width:560px;margin:2rem auto"><h2>Application not found</h2><p>That link is not valid or the application was removed.</p><a class="btn" href="#/">Home</a></div>` });
  const org = form.orgId ? orgById(form.orgId) : null;
  const user = currentUser();
  const draft = user && query.get('draft') ? DB.data.submissions.find((s) => s.formId === form.id && s.userId === user.id && s.status === 'draft') : null;
  return renderPublicForm(form, org, user, { draft });
});

/* ------------------------------------------------------------- submissions -- */

function validateAnswers(questions, formData, { partial = false } = {}) {
  const answers = {};
  const errors = {};
  for (const q of questions) {
    const name = `q_${q.id}`;
    if (q.type === 'multiselect') {
      const list = formData.getAll(name).map(String);
      if (q.required && !list.length && !partial) errors[q.id] = `Choose at least one option for "${q.label}".`;
      answers[q.id] = list;
    } else if (q.type === 'checkbox') {
      const checked = formData.get(name) === 'yes';
      if (q.required && !checked && !partial) errors[q.id] = `Please confirm "${q.label}".`;
      answers[q.id] = checked ? 'yes' : 'no';
    } else if (q.type === 'file') {
      const file = formData.get(name);
      if (!file || !file.size) {
        if (q.required && !partial) errors[q.id] = `Attach a file for "${q.label}".`;
        answers[q.id] = null;
      }
    } else {
      const value = String(formData.get(name) || '').trim();
      if (!value) {
        if (q.required && !partial) errors[q.id] = `"${q.label}" is required.`;
        answers[q.id] = '';
        continue;
      }
      if (value.length > 5000) errors[q.id] = `"${q.label}" is too long.`;
      if (q.type === 'number' && !/^\d+(\.\d+)?$/.test(value)) errors[q.id] = `"${q.label}" must be a number.`;
      if (q.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value)) errors[q.id] = `"${q.label}" must be a valid email address.`;
      if (q.type === 'url') {
        try {
          const u = new URL(value);
          if (!['http:', 'https:'].includes(u.protocol)) throw new Error();
        } catch { errors[q.id] = `"${q.label}" must be a full link starting with https://`; }
      }
      if (q.type === 'select' && !(q.options || []).includes(value)) errors[q.id] = `Choose one of the listed options for "${q.label}".`;
      answers[q.id] = value;
    }
  }
  return { answers, errors };
}

function readFileField(file, maxBytes = 300 * 1024) {
  return new Promise((resolve, reject) => {
    if (!file || !file.size) return resolve(null);
    if (file.size > maxBytes) return reject(new Error(`That file is ${bytes(file.size)}. The limit in this build is ${bytes(maxBytes)}.`));
    const allowed = ['application/pdf', 'image/png', 'image/jpeg', 'image/webp', 'text/plain', 'application/msword', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'];
    if (file.type && !allowed.includes(file.type)) return reject(new Error('Use a PDF, DOCX, PNG, JPEG or TXT file.'));
    const reader = new FileReader();
    reader.onload = () => resolve({ name: file.name.slice(0, 160), size: file.size, type: file.type || 'application/octet-stream', data: reader.result });
    reader.onerror = () => reject(new Error('The file could not be read.'));
    reader.readAsDataURL(file);
  });
}

async function submitApplication(form, formData, intent) {
  const user = currentUser();
  if (!user) throw new Error('Sign in to submit an application.');
  if (form.status !== 'published') throw new Error('This application is not accepting submissions.');
  if (form.closesAt && new Date(form.closesAt) < new Date()) throw new Error('This application has closed.');
  const questions = questionsFor(form.id);
  const { answers, errors } = validateAnswers(questions, formData, { partial: intent === 'draft' });
  if (Object.keys(errors).length) {
    const error = new Error('Please fix the highlighted answers.');
    error.errors = errors;
    error.values = answers;
    throw error;
  }
  for (const q of questions) {
    if (q.type !== 'file') continue;
    const file = formData.get(`q_${q.id}`);
    if (file && file.size) {
      try { answers[q.id] = await readFileField(file); }
      catch (error) { const e = new Error(error.message); e.errors = { [q.id]: error.message }; e.values = answers; throw e; }
    } else {
      answers[q.id] = null;
    }
  }

  const existing = DB.data.submissions.filter((s) => s.formId === form.id && s.userId === user.id && s.status !== 'draft');
  if (existing.length && !form.allowMultiple) throw new Error('You have already submitted this application.');
  if (existing.length >= (form.maxPerUser || 1)) throw new Error(`You have reached the limit of ${form.maxPerUser} submissions for this application.`);

  let draft = DB.data.submissions.find((s) => s.formId === form.id && s.userId === user.id && s.status === 'draft');
  if (!draft) {
    draft = {
      id: id('sub'), formId: form.id, userId: user.id, applicantName: user.name,
      applicantEmail: user.email, discordId: user.discordId || '', answers: {},
      status: 'draft', source: 'web', assignedTo: null, decidedBy: null, decidedAt: null,
      decisionNote: '', publicToken: randomToken(), createdAt: now(), updatedAt: now(), submittedAt: null
    };
    DB.data.submissions.push(draft);
  }
  draft.answers = answers;
  draft.updatedAt = now();

  if (intent === 'draft') {
    DB.save();
    return { draft };
  }

  draft.status = 'submitted';
  draft.submittedAt = now();
  draft.updatedAt = now();
  addEvent(draft.id, { actorId: user.id, actorLabel: user.name, kind: 'submitted', to: 'submitted', body: `Submitted ${form.name}.`, visibility: 'applicant' });
  const org = form.orgId ? orgById(form.orgId) : null;
  if (org) {
    notifyRoles(org.id, ['owner', 'admin', 'manager', 'reviewer'], {
      kind: 'submission.new',
      title: `New ${KIND_LABELS[form.kind] ? KIND_LABELS[form.kind].toLowerCase() : 'application'}: ${form.name}`,
      body: `${user.name} submitted ${form.name}.`,
      link: `/org/${org.slug}/review/${draft.id}`
    });
  } else {
    notify(form.ownerId, {
      kind: 'submission.new', title: `New submission: ${form.name}`,
      body: `${user.name} submitted your application.`, link: `/submissions/${draft.id}`
    });
  }
  notify(user.id, {
    kind: 'submission.receipt',
    title: `Application received: ${form.name}`,
    body: 'Your answers are with the team. You can track the status from your dashboard.',
    link: `/s/${draft.publicToken}`
  });
  runAutomations(form, draft, 'submitted', 'Automation');
  DB.save();
  if (org && org.discordWebhookUrl) {
    void sendDiscord(org, `**New ${KIND_LABELS[form.kind] || 'application'} — ${form.name}**\n${user.name} just submitted. Open the review dashboard to read it.`);
  }
  return { submission: draft };
}

route('/forms/:id/review', (params, query) => {
  const user = requireUser();
  if (!user) return null;
  const form = formById(params.id);
  if (!form || form.deletedAt) { renderNotFound('That application does not exist.'); return null; }
  if (form.ownerId !== user.id) { renderForbidden('Only the owner of this application can review it.'); return null; }

  const search = (query.get('q') || '').toLowerCase();
  let subs = DB.data.submissions.filter((s) => s.formId === form.id && s.status !== 'draft');

    title: `Review ${form.name}`,
    body: `${pageHead(`Review: ${form.name}`, `${plural(subs.length, 'submission')} in this view.`, [['Dashboard', '/dashboard'], [form.name, `/forms/${form.id}`], ['Review', '']])}

});

route('/org/:slug/review', (params, query) => {
  const access = requireOrgAccess(params.slug, 'submission.read');
  if (!access) return null;
  const { org, role } = access;
  const status = query.get('status') || 'open';
  const formFilter = query.get('form') || '';
  const assignee = query.get('assignee') || '';
  const search = (query.get('q') || '').toLowerCase();
  const page = Math.max(1, Number(query.get('page') || 1));
  const perPage = 10;
  const forms = orgForms(org.id);
  const formIds = new Set(forms.map((f) => f.id));

  let subs = DB.data.submissions.filter((s) => formIds.has(s.formId) && s.status !== 'draft');
  if (status === 'open') subs = subs.filter((s) => ['submitted', 'under_review', 'info_required'].includes(s.status));
  else if (status === 'decided') subs = subs.filter((s) => ['approved', 'rejected'].includes(s.status));
  else if (status !== 'all') subs = subs.filter((s) => s.status === status);
  if (formFilter) subs = subs.filter((s) => s.formId === formFilter);
  if (assignee === 'me') subs = subs.filter((s) => s.assignedTo === currentUser().id);
  else if (assignee === 'unassigned') subs = subs.filter((s) => !s.assignedTo);
  else if (assignee) subs = subs.filter((s) => s.assignedTo === assignee);
  if (search) subs = subs.filter((s) => `${s.applicantName} ${s.applicantEmail} ${s.id}`.toLowerCase().includes(search));
  subs.sort((a, b) => new Date(b.submittedAt || b.createdAt) - new Date(a.submittedAt || a.createdAt));

  const pages = Math.max(1, Math.ceil(subs.length / perPage));
  const current = Math.min(page, pages);
  const slice = subs.slice((current - 1) * perPage, current * perPage);
  const makeHref = (p) => {
    const q = new URLSearchParams();
    if (status !== 'open') q.set('status', status);
    if (formFilter) q.set('form', formFilter);
    if (assignee) q.set('assignee', assignee);
    if (search) q.set('q', search);
    if (p > 1) q.set('page', String(p));
    return `#/org/${org.slug}/review${q.toString() ? `?${q}` : ''}`;
  };
  const members = reviewerMembers(org);

  const body = `
  <div class="row between mb">
    <div><h2 style="font-size:1.3rem">Review queue</h2><p class="sub">${subs.length} submissions in this view.</p></div>
    <div class="btn-row">
      ${can(role, 'submission.export') ? `<button class="btn ghost sm" data-act="export-org-csv" data-org="${attr(org.id)}">Export CSV</button>` : ''}
      <a class="btn ghost sm" href="#/org/${attr(org.slug)}/forms">Applications</a>
    </div>
  </div>

  <form class="filters" data-form="review-filters">
    <div class="field"><label for="rq">Search</label><input id="rq" type="text" name="q" value="${attr(search)}" placeholder="Name, email or reference"></div>
    <div class="field"><label for="rf">Application</label><select id="rf" name="form"><option value="">All applications</option>${forms.map((f) => `<option value="${attr(f.id)}"${f.id === formFilter ? ' selected' : ''}>${esc(f.name)}</option>`).join('')}</select></div>
    <div class="field"><label for="ra">Assigned to</label><select id="ra" name="assignee"><option value="">Anyone</option><option value="me"${assignee === 'me' ? ' selected' : ''}>Me</option><option value="unassigned"${assignee === 'unassigned' ? ' selected' : ''}>Unassigned</option>${members.map((m) => `<option value="${attr(m.userId)}"${assignee === m.userId ? ' selected' : ''}>${esc(m.name || m.email)}</option>`).join('')}</select></div>
    <div class="field"><label for="rs">Status</label><select id="rs" name="status">${[['open', 'Open'], ['all', 'All'], ['submitted', 'Submitted'], ['under_review', 'Under review'], ['info_required', 'Information required'], ['approved', 'Approved'], ['rejected', 'Rejected'], ['closed', 'Closed']].map(([v, l]) => `<option value="${v}"${status === v ? ' selected' : ''}>${l}</option>`).join('')}</select></div>
    <div class="field"><label>&nbsp;</label><button class="btn" type="submit">Apply</button></div>
  </form>

  ${slice.length ? `<div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>Applicant</th><th>Application</th><th>Status</th><th>Assigned</th><th>Submitted</th><th></th></tr></thead>
    <tbody>${slice.map((s) => {
      const f = formById(s.formId);
      const who = s.assignedTo ? userById(s.assignedTo) : null;
      return `<tr>
        <td><a class="name" href="#/org/${attr(org.slug)}/review/${attr(s.id)}">${esc(s.applicantName)}</a><div class="sub">${esc(s.applicantEmail || '')}</div></td>
        <td class="sub">${esc(f ? f.name : '—')}</td>
        <td>${statusPill(s.status)}</td>
        <td class="sub">${who ? esc(who.name) : '<span class="faint">Unassigned</span>'}</td>
        <td class="sub nowrap">${esc(timeAgo(s.submittedAt))}</td>
        <td><a class="btn ghost sm" href="#/org/${attr(org.slug)}/review/${attr(s.id)}">Open</a></td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>
  ${pager({ page: current, pages, makeHref })}` : emptyState({
    title: 'Nothing in this view',
    body: status === 'open' ? 'No submissions are waiting. New ones will appear here automatically.' : 'Try a different filter or clear the search.',
    action: `<a class="btn ghost" href="#/org/${attr(org.slug)}/review?status=all">Show all submissions</a>`
  })}`;
  return orgPage({ org, active: 'review', body });
});

function requireAdmin() {
  const user = requireUser('/admin');
  if (!user) return null;
  if (user.platformRole !== 'admin') { renderForbidden('Platform administration is limited to administrators.'); return null; }
  return user;
}

function adminNav(active) {
  const items = [
    ['overview', 'Overview', '/admin'],
    ['users', 'Users', '/admin/users'],
    ['orgs', 'Organizations', '/admin/orgs'],
    ['forms', 'Applications', '/admin/forms'],
    ['submissions', 'Submissions', '/admin/submissions'],
    ['support', 'Support', '/admin/support'],
    ['activity', 'Activity', '/admin/activity'],
    ['settings', 'Settings', '/admin/settings']
  ];
  return `<nav class="tabs" aria-label="Administration">${items.map(([key, label, href]) =>
    `<a href="#${href}"${key === active ? ' class="on" aria-current="page"' : ''}>${esc(label)}</a>`
  ).join('')}</nav>`;
}

function adminPage({ user, active, title, lead = '', body }) {
  const openSupport = DB.data.support.filter((s) => s.status !== 'closed').length;
  return shell({
    title,
    wide: true,
    body: `<div class="page-head">
      <div class="crumb">Platform administration</div>
      <div class="row between" style="align-items:flex-end"><div><h1>${esc(title)}</h1>${lead ? `<p class="lead">${esc(lead)}</p>` : ''}</div>
      <div class="row" style="gap:.5rem"><span class="tag">${esc(user.name)}</span>${openSupport ? `<a class="btn ghost sm" href="#/admin/support">${openSupport} open support</a>` : ''}</div></div>
    </div>
    ${adminNav(active)}
    ${body}`
  });
}

/* ------------------------------------------------------------- form helpers -- */

function formDataOf(formEl, submitter) {
  try { return new FormData(formEl, submitter || undefined); }
  catch { return new FormData(formEl); }
}

function str(fd, key, fallback = '') {
  const value = fd.get(key);
  return value === null || value === undefined ? fallback : String(value).trim();
}

function canEditForm(form) {
  const user = currentUser();
  if (!user || !form) return false;
  if (form.orgId) return canOrg(form.orgId, 'form.write');
  return form.ownerId === user.id;
}

function canReadForm(form) {
  const user = currentUser();
  if (!user || !form) return false;
  if (form.orgId) return canOrg(form.orgId, 'form.read');
  return form.ownerId === user.id;
}

function requireFormOwnerOrOrg(form, capability) {
  const user = currentUser();
  if (!user) throw new Error('Sign in first.');
  if (!form) throw new Error('Application not found.');
  if (form.orgId) {
    if (!canOrg(form.orgId, capability)) throw new Error('Your role does not allow that.');
  } else if (form.ownerId !== user.id) {
    throw new Error('Only the owner of this application can do that.');
  }
  return user;
}

/* ------------------------------------------------------------------- builder -- */

function handleBuilder(formEl, submitter) {
  const user = currentUser();
  if (!user) throw new Error('Sign in first.');
  const record = formById(formEl.dataset.id);
  if (!record) throw new Error('Application not found.');
  if (!canEditForm(record)) throw new Error('You do not have permission to edit this application.');

  const fd = formDataOf(formEl, submitter);
  const action = str(fd, 'action', 'save') || 'save';
  const name = str(fd, 'name');
  if (name.length < 2) throw new Error('Give the application a name.');
  if (name.length > 120) throw new Error('That name is too long.');
  const slug = slugify(str(fd, 'slug') || name);
  if (slug.length < 2) throw new Error('The public address needs at least two letters or numbers.');
  const clash = DB.data.forms.find((f) => f.slug === slug && f.id !== record.id && !f.deletedAt);
  if (clash) throw new Error('That public address is already used by another application.');
  const kind = str(fd, 'kind', 'application');
  if (!KIND_LABELS[kind]) throw new Error('Choose a valid application type.');

  const existing = questionsFor(record.id);
  const edits = existing.map((q) => ({
    id: q.id,
    label: str(fd, `label__${q.id}`),
    type: str(fd, `type__${q.id}`, q.type),
    required: fd.get(`required__${q.id}`) === 'on',
    options: str(fd, `options__${q.id}`).split(',').map((s) => s.trim()).filter(Boolean),
    help: str(fd, `help__${q.id}`)
  }));
  for (const edit of edits) {
    if (!edit.label) throw new Error('Every question needs a label. Delete the question if you do not want it.');
    if (!QUESTION_TYPES[edit.type]) throw new Error('Choose a valid question type.');
    if ((edit.type === 'select' || edit.type === 'multiselect') && edit.options.length < 1) {
      throw new Error(`"${edit.label}" needs at least one choice.`);
    }
  }

  if (action.startsWith('delete:')) {
    const qid = action.slice(7);
    DB.data.questions = DB.data.questions.filter((q) => q.id !== qid);
  }

  const remaining = questionsFor(record.id);
  remaining.forEach((q, index) => { q.position = index; });
  if (action.startsWith('up:') || action.startsWith('down:')) {
    const qid = action.split(':')[1];
    const index = remaining.findIndex((q) => q.id === qid);
    const target = action.startsWith('up:') ? index - 1 : index + 1;
    if (index >= 0 && target >= 0 && target < remaining.length) {
      const a = remaining[index].position;
      remaining[index].position = remaining[target].position;
      remaining[target].position = a;
    }
  }

  for (const edit of edits) {
    const question = DB.data.questions.find((q) => q.id === edit.id);
    if (!question) continue;
    question.label = edit.label.slice(0, 200);
    question.type = edit.type;
    question.required = edit.required;
    question.options = edit.options.slice(0, 30);
    question.help = edit.help.slice(0, 300);
  }

  record.name = name;
  record.slug = slug;
  record.kind = kind;
  record.description = str(fd, 'description').slice(0, 1000);
  record.instructions = str(fd, 'instructions').slice(0, 2000);
  record.confirmationMessage = str(fd, 'confirmationMessage').slice(0, 1000);
  record.allowMultiple = fd.get('allowMultiple') === 'on';
  record.maxPerUser = Math.min(20, Math.max(1, Number(str(fd, 'maxPerUser', '1')) || 1));
  const closes = str(fd, 'closesAt');
  record.closesAt = closes ? new Date(closes).toISOString() : null;
  record.updatedAt = now();

  if (action === 'add') {
    DB.data.questions.push({
      id: id('q'), formId: record.id, label: 'Untitled question', type: 'short',
      required: false, options: [], help: '', position: questionsFor(record.id).length, maxLength: null
    });
    flash('good', 'Question added. Edit the label and save.');
  } else if (action.startsWith('delete:')) {
    flash('good', 'Question deleted.');
  } else {
    flash('good', 'Application saved.');
  }

  auditLog(record.orgId || null, 'form.updated', { name: record.name }, user.id);
  DB.save();
  render();
}

/* --------------------------------------------------------------- status flow -- */

function applyStatusChange(sub, status, note, actor) {
  const form = formById(sub.formId);
  if (!form) throw new Error('Application not found.');
  const org = form.orgId ? orgById(form.orgId) : null;
  const allowed = TRANSITIONS[sub.status] || [];
  if (!allowed.includes(status)) {
    throw new Error(`You cannot move this from ${(STATUS[sub.status] || {}).label || sub.status} to ${(STATUS[status] || {}).label || status}.`);
  }
  const cleanNote = String(note || '').trim().slice(0, 2000);
  if (['approved', 'rejected', 'info_required'].includes(status) && !cleanNote) {
    throw new Error('Add a note for the applicant before using this status.');
  }
  const from = sub.status;
  sub.status = status;
  sub.updatedAt = now();
  if (['approved', 'rejected'].includes(status)) {
    sub.decidedBy = actor.id;
    sub.decidedAt = now();
    sub.decisionNote = cleanNote;
  }
  addEvent(sub.id, {
    actorId: actor.id, actorLabel: actor.name, kind: 'status', from, to: status,
    body: cleanNote, visibility: 'applicant'
  });
  if (sub.userId) {
    notify(sub.userId, {
      kind: 'submission.status',
      title: `${form.name}: ${STATUS[status].label}`,
      body: cleanNote || STATUS[status].hint,
      link: `/s/${sub.publicToken}`
    });
  }
  if (org) {
    auditLog(org.id, ['approved', 'rejected'].includes(status) ? 'submission.decided' : 'submission.status_changed',
      { submission: sub.id, from, to: status }, actor.id);
  }
  if (['approved', 'rejected'].includes(status)) runAutomations(form, sub, 'decided', actor.name);
  if (status === 'info_required') runAutomations(form, sub, 'info_required', actor.name);
  DB.save();
  if (org && org.discordWebhookUrl && ['approved', 'rejected'].includes(status)) {
    void sendDiscord(org, `**${form.name}** — ${sub.applicantName} was ${status}.`);
  }
  return sub;
}

const FORMS = {
  async login(formEl) {
    const fd = formDataOf(formEl, null);
    const user = await loginUser(str(fd, 'email'), String(fd.get('password') || ''));
    const next = formEl.dataset.next || sessionStorage.getItem('ks_return') || '/dashboard';
    sessionStorage.removeItem('ks_return');
    toast(`Welcome back, ${user.name.split(' ')[0]}`);
    go(next.startsWith('/') ? next : '/dashboard');
  },

  async register(formEl) {
    const fd = formDataOf(formEl, null);
    if (fd.get('terms') !== 'yes') throw new Error('Please agree to the Terms of Service and Privacy Policy.');
    const user = await registerUser({
      name: str(fd, 'name'),
      email: str(fd, 'email'),
      password: String(fd.get('password') || ''),
      password2: String(fd.get('password2') || '')
    });
    sessionStorage.removeItem('ks_return');
    toast(`Welcome, ${user.name.split(' ')[0]}`);
    const template = formEl.dataset.template;
    go(template ? `/forms/new?template=${encodeURIComponent(template)}` : '/dashboard');
  },

  async contact(formEl) {
    const fd = formDataOf(formEl, null);
    const user = currentUser();
    const email = user ? user.email : str(fd, 'email').toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) throw new Error('Enter a valid email address so we can reply.');
    const subject = str(fd, 'subject');
    const message = str(fd, 'message');
    if (subject.length < 3) throw new Error('Add a subject.');
    if (message.length < 10) throw new Error('Add a little more detail to your message.');
    DB.data.support.push({
      id: id('sup'), userId: user ? user.id : null, email, subject: subject.slice(0, 160),
      message: message.slice(0, 5000), status: 'open', createdAt: now(), updatedAt: now()
    });
    DB.save();
    flash('good', 'Message sent. We reply by email.');
    render();
  },

  async 'accept-invite'(formEl) {
    const user = currentUser();
    if (!user) throw new Error('Sign in first.');
    const invite = DB.data.invites.find((i) => i.token === formEl.dataset.token);
    if (!invite || invite.status !== 'pending') throw new Error('That invitation is no longer valid.');
    if (invite.email !== user.email.toLowerCase()) throw new Error('This invitation is for a different email address.');
    const org = orgById(invite.orgId);
    if (!org) throw new Error('That workspace no longer exists.');
    invite.status = 'accepted';
    const member = DB.data.members.find((m) => m.orgId === invite.orgId && m.email === invite.email);
    if (member) {
      member.userId = user.id;
      member.name = user.name;
      member.status = 'active';
      member.acceptedAt = now();
    }
    auditLog(org.id, 'team.invited', { email: user.email, role: invite.role, accepted: true }, user.id);
    DB.save();
    flash('good', `You joined ${org.name}.`);
    go(`/org/${org.slug}`);
  },

  async profile(formEl) {
    const user = currentUser();
    if (!user) throw new Error('Sign in first.');
    const fd = formDataOf(formEl, null);
    const name = str(fd, 'name');
    const email = str(fd, 'email').toLowerCase();
    const discordId = str(fd, 'discordId');
    if (name.length < 2) throw new Error('Enter your name.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) throw new Error('Enter a valid email address.');
    const clash = DB.data.users.find((u) => u.email.toLowerCase() === email && u.id !== user.id && !u.deletedAt);
    if (clash) throw new Error('Another account already uses that email address.');
    if (discordId && !/^\d{17,20}$/.test(discordId)) throw new Error('A Discord user ID is 17 to 20 digits.');
    user.name = name.slice(0, 80);
    user.email = email;
    user.discordId = discordId;
    for (const member of DB.data.members.filter((m) => m.userId === user.id)) {
      member.name = user.name;
      member.email = email;
    }
    auditLog(null, 'user.profile_updated', {}, user.id);
    DB.save();
    flash('good', 'Profile saved.');
    render();
  },

  async password(formEl) {
    const user = currentUser();
    if (!user) throw new Error('Sign in first.');
    const fd = formDataOf(formEl, null);
    await changePassword(user, String(fd.get('current') || ''), String(fd.get('next') || ''), String(fd.get('confirm') || ''));
    flash('good', 'Password changed. Other sessions were signed out.');
    render();
  },

  async 'notification-prefs'(formEl) {
    const user = currentUser();
    if (!user) throw new Error('Sign in first.');
    const fd = formDataOf(formEl, null);
    user.prefs = { ...(user.prefs || {}), notifyApplicationUpdates: fd.get('notifyApplicationUpdates') === 'yes' };
    DB.save();
    flash('good', 'Notification preferences saved.');
    render();
  },

  async 'sign-out-others'() {
    const user = currentUser();
    if (!user) throw new Error('Sign in first.');
    const active = storage.getItem(SESSION_KEY);
    let count = 0;
    for (const [token, session] of Object.entries(DB.data.sessions)) {
      if (session.userId === user.id && token !== active) { delete DB.data.sessions[token]; count += 1; }
    }
    DB.save();
    flash('good', count ? `Signed out ${plural(count, 'other session')}.` : 'No other sessions were active.');
    render();
  },

  async 'delete-account'() {
    const user = currentUser();
    if (!user) throw new Error('Sign in first.');
    const owned = DB.data.orgs.filter((o) => o.ownerId === user.id && !o.deletedAt);
    if (owned.length) throw new Error('Transfer or delete your workspaces before deleting your account.');
    for (const sub of DB.data.submissions.filter((s) => s.userId === user.id)) {
      sub.userId = null;
      sub.applicantName = 'Deleted account';
      sub.applicantEmail = '';
      sub.discordId = '';
    }
    for (const member of DB.data.members.filter((m) => m.userId === user.id)) member.status = 'removed';
    for (const invite of DB.data.invites.filter((i) => i.email === user.email.toLowerCase())) invite.status = 'revoked';
    DB.data.notifications = DB.data.notifications.filter((n) => n.userId !== user.id);
    for (const [token, session] of Object.entries(DB.data.sessions)) {
      if (session.userId === user.id) delete DB.data.sessions[token];
    }
    user.deletedAt = now();
    user.email = `deleted-${user.id}@invalid.local`;
    user.name = 'Deleted account';
    auditLog(null, 'user.deleted', {}, user.id);
    storage.removeItem(SESSION_KEY);
    DB.save();
    go('/');
    toast('Your account was deleted.');
  },

  async 'create-org'(formEl) {
    const user = currentUser();
    if (!user) throw new Error('Sign in first.');
    const fd = formDataOf(formEl, null);
    const org = createOrg({
      name: str(fd, 'name'), slug: str(fd, 'slug'), description: str(fd, 'description'),
      brandColor: str(fd, 'brandColor'), owner: user
    });
    flash('good', `${org.name} is ready. Invite your team next.`);
    go(`/org/${org.slug}`);
  },

  async 'create-form'(formEl) {
    const user = currentUser();
    if (!user) throw new Error('Sign in first.');
    const fd = formDataOf(formEl, null);
    const name = str(fd, 'name');
    if (name.length < 2) throw new Error('Give the application a name.');
    const slug = slugify(str(fd, 'slug') || name);
    if (slug.length < 2) throw new Error('The public address needs at least two letters or numbers.');
    if (DB.data.forms.some((f) => f.slug === slug && !f.deletedAt)) throw new Error('That public address is already taken.');
    const kind = str(fd, 'kind', 'application');
    if (!KIND_LABELS[kind]) throw new Error('Choose a valid type.');
    const orgId = str(fd, 'orgId');
    let org = null;
    if (orgId) {
      org = orgById(orgId);
      if (!org || org.deletedAt) throw new Error('That workspace does not exist.');
      if (!canOrg(org.id, 'form.write')) throw new Error('Your role cannot create applications in that workspace.');
      const used = orgForms(org.id).length;
      if (used >= org.formLimit) throw new Error(`This workspace allows ${org.formLimit} applications.`);
    } else {
      const used = DB.data.forms.filter((f) => f.ownerId === user.id && !f.orgId && !f.deletedAt).length;
      if (used >= 5) throw new Error('The Free plan allows 5 personal applications. Create a workspace for more, or delete an old application.');
    }
    const form = {
      id: id('frm'), orgId: org ? org.id : null, ownerId: user.id, name: name.slice(0, 120),
      slug, kind, description: str(fd, 'description').slice(0, 1000),
      instructions: '', confirmationMessage: org ? org.confirmationMessage : 'Thanks — your application has been received.',
      status: 'draft', allowMultiple: false, maxPerUser: 1, opensAt: null, closesAt: null,
      createdAt: now(), publishedAt: null, updatedAt: now()
    };
    DB.data.forms.push(form);
    const templateId = str(fd, 'template');
    if (templateId) copyTemplateQuestions(templateId, form.id);
    auditLog(form.orgId, 'form.created', { name: form.name }, user.id);
    DB.save();
    flash('good', 'Application created. Add your questions, then publish it.');
    go(org ? `/org/${org.slug}/forms/${form.id}/edit` : `/forms/${form.id}/edit`);
  },

  builder(formEl, submitter) {
    handleBuilder(formEl, submitter);
  },

  async 'submit-application'(formEl, submitter) {
    const form = formById(formEl.dataset.id);
    if (!form) throw new Error('Application not found.');
    const fd = formDataOf(formEl, submitter);
    const intent = str(fd, 'intent', 'submit') === 'draft' ? 'draft' : 'submit';
    try {
      const result = await submitApplication(form, fd, intent);
      if (intent === 'draft') {
        flash('good', 'Draft saved. You can come back and finish it later.');
        render();
        return;
      }
      toast('Application submitted.');
      go(`/s/${result.submission.publicToken}`);
    } catch (error) {
      if (error.errors) {
        const org = form.orgId ? orgById(form.orgId) : null;
        document.getElementById('app').innerHTML = renderPublicForm(form, org, currentUser(), {
          errors: error.errors, values: error.values
        });
        toast(error.message, 'bad');
        return;
      }
      throw error;
    }
  },

  async 'review-status'(formEl) {
    const user = currentUser();
    const sub = submissionById(formEl.dataset.id);
    if (!sub) throw new Error('Submission not found.');
    const form = formById(sub.formId);
    if (!form) throw new Error('Application not found.');
    if (form.orgId) {
      if (!canOrg(form.orgId, 'submission.decide')) throw new Error('Your role cannot change statuses.');
    } else if (form.ownerId !== user.id) throw new Error('You cannot review this submission.');
    const fd = formDataOf(formEl, null);
    applyStatusChange(sub, str(fd, 'status'), str(fd, 'note'), user);
    flash('good', 'Status updated and the applicant was notified.');
    render();
  },

  async 'review-note'(formEl) {
    const user = currentUser();
    const sub = submissionById(formEl.dataset.id);
    if (!sub) throw new Error('Submission not found.');
    const form = formById(sub.formId);
    if (!form) throw new Error('Application not found.');
    if (form.orgId ? !canOrg(form.orgId, 'submission.note') : form.ownerId !== user.id) throw new Error('You cannot add notes.');
    const fd = formDataOf(formEl, null);
    const body = str(fd, 'body');
    if (!body) throw new Error('Write a note first.');
    addEvent(sub.id, { actorId: user.id, actorLabel: user.name, kind: 'note', body, visibility: 'internal' });

  async 'review-message'(formEl) {
    const user = currentUser();
    const sub = submissionById(formEl.dataset.id);
    if (!sub) throw new Error('Submission not found.');
    const form = formById(sub.formId);
    if (!form) throw new Error('Application not found.');
    if (form.orgId ? !canOrg(form.orgId, 'submission.message') : form.ownerId !== user.id) throw new Error('You cannot message applicants.');
    const fd = formDataOf(formEl, null);
    const body = str(fd, 'body');

        kind: 'submission.message', title: `New message about ${form.name}`,

      });

    flash('good', 'Message sent to the applicant.');
    render();
  },

  async assign(formEl) {
    const user = currentUser();
    const sub = submissionById(formEl.dataset.id);
    if (!sub) throw new Error('Submission not found.');
    const form = formById(sub.formId);
    if (!form) throw new Error('Application not found.');
    if (form.orgId ? !canOrg(form.orgId, 'submission.assign') : form.ownerId !== user.id) throw new Error('You cannot assign this submission.');
    const fd = formDataOf(formEl, null);
    const userId = str(fd, 'userId');
    if (userId) {
      const member = form.orgId ? membershipFor(form.orgId, userId) : null;
      if (form.orgId && !member) throw new Error('Choose an active team member.');
      if (!form.orgId && userId !== user.id) throw new Error('You can only assign a personal application to yourself.');
    }
    sub.assignedTo = userId || null;
    sub.updatedAt = now();
    addEvent(sub.id, {
      actorId: user.id, actorLabel: user.name, kind: 'assigned', visibility: 'internal',
      body: userId ? `Assigned to ${(userById(userId) || {}).name || 'a reviewer'}.` : 'Unassigned.'
    });
    if (userId && userId !== user.id) {
      notify(userId, {
        kind: 'submission.assigned', title: `You were assigned a review`,
        body: `${sub.applicantName} — ${form.name}`, link: form.orgId ? `/org/${(orgById(form.orgId) || {}).slug}/review/${sub.id}` : `/submissions/${sub.id}`
      });

    if (!sub || sub.userId !== user.id) throw new Error('You cannot reply to that application.');

      }, user.id);

  async 'automation-add'(formEl) {
    const user = currentUser();
    const fd = formDataOf(formEl, null);
    const formId = str(fd, 'formId');
    const form = formById(formId);
    if (!form) throw new Error('Choose an application.');
    if (!canEditForm(form)) throw new Error('You cannot configure this application.');
    const trigger = str(fd, 'trigger', 'submitted');
    const action = str(fd, 'action', 'notify');
    if (!['submitted', 'decided', 'info_required'].includes(trigger)) throw new Error('Choose a valid trigger.');
    if (!['notify', 'assign', 'message', 'set_status'].includes(action)) throw new Error('Choose a valid action.');
    const config = {};
    if (action === 'notify') {
      config.roles = ['owner', 'admin', 'manager', 'reviewer'];
      config.title = str(fd, 'title') || 'Update on {{form}}';
      config.body = str(fd, 'body') || '{{applicant}} — {{status}}';
    } else if (action === 'assign') {
      config.mode = str(fd, 'assignMode', 'round_robin');
      if (config.mode === 'user') {
        config.userId = str(fd, 'assignUser');
        if (!config.userId) throw new Error('Choose the person to assign to.');
      }
    } else if (action === 'set_status') {
      config.status = str(fd, 'status', 'under_review');
      const allowed = trigger === 'submitted' ? ['under_review', 'info_required'] : ['closed'];
      if (!allowed.includes(config.status)) throw new Error('That status is not allowed for this trigger.');
    } else {
      config.body = str(fd, 'body') || 'Thanks — we have received your application. Reference {{reference}}.';
    }
    DB.data.automations.push({
      id: id('aut'), formId: form.id, trigger, action, config,
      active: true, createdAt: now()
    });
    auditLog(form.orgId, 'form.updated', { automation: action, trigger }, user.id);
    DB.save();
    flash('good', 'Automation added. It runs on the next matching event.');
    render();
  },

  async 'org-webhook'(formEl) {

    const org = orgById(formEl.dataset.orgId);
    if (!org) throw new Error('Workspace not found.');

    const fd = formDataOf(formEl, null);
    const url = str(fd, 'discordWebhookUrl');
    if (url && !/^https:\/\/(canary\.|ptb\.)?discord(app)?\.com\/api\/webhooks\//i.test(url)) {

    }

    org.updatedAt = now();

    flash('good', url ? 'Discord webhook saved.' : 'Discord webhook removed.');

  },

  async 'guild-settings'(formEl) {
    const user = currentUser();
    const org = orgById(formEl.dataset.orgId);
    if (!org) throw new Error('Workspace not found.');
    if (!canOrg(org.id, 'org.integrations')) throw new Error('Your role cannot change integrations.');
    const fd = formDataOf(formEl, null);
    const guildId = str(fd, 'guildId');
    if (guildId && !/^\d{17,20}$/.test(guildId)) throw new Error('A server ID is 17 to 20 digits.');
    const channel = (key) => {
      const value = str(fd, key);
      if (value && !/^\d{17,20}$/.test(value)) throw new Error(`${key} must be a numeric channel ID.`);
      return value;
    };
    const roles = (key) => str(fd, key).split(',').map((s) => s.trim()).filter(Boolean).map((value) => {
      if (!/^\d{17,20}$/.test(value)) throw new Error('Role IDs must be numeric, separated by commas.');
      return value;
    });
    let guild = DB.data.guilds.find((g) => g.orgId === org.id);
    if (!guild) {
      guild = {
        id: id('gld'), guildId: '', name: '', orgId: org.id, reviewChannelId: '', notificationChannelId: '',
        applyChannelId: '', adminRoleIds: [], reviewerRoleIds: [], notifyNew: true, notifyDecisions: true,
        dmApplicants: true, createdAt: now(), updatedAt: now()
      };
      DB.data.guilds.push(guild);
    }
    guild.guildId = guildId;
    guild.name = str(fd, 'guildName').slice(0, 100);
    guild.reviewChannelId = channel('reviewChannelId');
    guild.notificationChannelId = channel('notificationChannelId');
    guild.reviewerRoleIds = roles('reviewerRoleIds');
    guild.adminRoleIds = roles('adminRoleIds');
    guild.notifyNew = fd.get('notifyNew') === 'yes';
    guild.notifyDecisions = fd.get('notifyDecisions') === 'yes';
    guild.dmApplicants = fd.get('dmApplicants') === 'yes';
    guild.updatedAt = now();
    auditLog(org.id, 'integration.guild_updated', { guildId }, user.id);
    DB.save();
    flash('good', 'Discord server settings saved.');
    render();
  },

  async 'org-settings'(formEl) {
    const user = currentUser();
    const org = orgById(formEl.dataset.orgId);
    if (!org) throw new Error('Workspace not found.');
    if (!canOrg(org.id, 'org.settings')) throw new Error('Your role cannot change these settings.');
    const fd = formDataOf(formEl, null);
    const name = str(fd, 'name');
    if (name.length < 2) throw new Error('Enter an organization name.');
    const slug = slugify(str(fd, 'slug') || name);
    if (slug.length < 2) throw new Error('The workspace address needs at least two characters.');
    const clash = DB.data.orgs.find((o) => o.slug === slug && o.id !== org.id && !o.deletedAt);
    if (clash) throw new Error('That workspace address is already taken.');
    const website = str(fd, 'website');
    if (website) {
      try { const u = new URL(website); if (!['http:', 'https:'].includes(u.protocol)) throw new Error(); }
      catch { throw new Error('The website must be a full URL starting with https://'); }
    }
    const email = str(fd, 'supportEmail');
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) throw new Error('Enter a valid support email address.');
    org.name = name.slice(0, 90);
    org.slug = slug;
    org.description = str(fd, 'description').slice(0, 400);
    org.website = website;
    org.supportEmail = email;
    org.confirmationMessage = str(fd, 'confirmationMessage').slice(0, 1000);
    org.updatedAt = now();
    auditLog(org.id, 'org.updated', { name: org.name, slug: org.slug }, user.id);
    DB.save();
    flash('good', 'Workspace profile saved.');
    go(`/org/${org.slug}/settings`);
  },

  async 'org-branding'(formEl) {
    const user = currentUser();
    const org = orgById(formEl.dataset.orgId);
    if (!org) throw new Error('Workspace not found.');
    if (!canOrg(org.id, 'org.branding')) throw new Error('Your role cannot change branding.');
    const fd = formDataOf(formEl, null);
    const colour = str(fd, 'brandColor');
    if (!/^#[0-9a-f]{6}$/i.test(colour)) throw new Error('Use a hex colour such as #c8f542.');

    org.updatedAt = now();
    auditLog(org.id, 'org.branding_updated', {}, user.id);

    render();
  },

  async 'org-plan'(formEl) {
    const user = currentUser();
    const org = orgById(formEl.dataset.orgId);
    if (!org) throw new Error('Workspace not found.');
    if (!canOrg(org.id, 'org.billing')) throw new Error('Only the owner can change the plan.');
    const fd = formDataOf(formEl, null);

  },

  async 'delete-org'(formEl) {
    const user = currentUser();
    const org = orgById(formEl.dataset.orgId);
    if (!org) throw new Error('Workspace not found.');
    if (!canOrg(org.id, 'org.delete')) throw new Error('Only the owner can delete this workspace.');
    const fd = formDataOf(formEl, null);
    if (str(fd, 'confirmName') !== org.name) throw new Error('Type the workspace name exactly to confirm.');
    const forms = orgForms(org.id);
    const formIds = new Set(forms.map((f) => f.id));
    const subs = DB.data.submissions.filter((s) => formIds.has(s.formId));
    const subIds = new Set(subs.map((s) => s.id));
    const autos = DB.data.automations.filter((a) => formIds.has(a.formId));
    const autoIds = new Set(autos.map((a) => a.id));
    DB.data.submissions = DB.data.submissions.filter((s) => !formIds.has(s.formId));
    DB.data.events = DB.data.events.filter((e) => !subIds.has(e.submissionId));
    DB.data.questions = DB.data.questions.filter((q) => !formIds.has(q.formId));
    DB.data.automations = DB.data.automations.filter((a) => !formIds.has(a.formId));
    DB.data.automationRuns = DB.data.automationRuns.filter((r) => !autoIds.has(r.automationId));
    DB.data.forms = DB.data.forms.filter((f) => f.orgId !== org.id);
    DB.data.members = DB.data.members.filter((m) => m.orgId !== org.id);
    DB.data.invites = DB.data.invites.filter((i) => i.orgId !== org.id);
    DB.data.guilds = DB.data.guilds.filter((g) => g.orgId !== org.id);
    DB.data.templates = DB.data.templates.filter((t) => t.orgId !== org.id);
    DB.data.audit = DB.data.audit.filter((a) => a.orgId !== org.id);
    DB.data.orgs = DB.data.orgs.filter((o) => o.id !== org.id);
    DB.save();
    toast('Workspace deleted.');
    go('/orgs');
  },
